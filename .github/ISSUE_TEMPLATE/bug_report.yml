name: Bug 报告 (Bug report)
description: 提交可复现的 Bug。必须附截图证据，无截图将被关闭。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请保持本模板完整并填写所有必填部分。缺少截图证据、冒烟测试或代码引用的 Bug 报告将被自动关闭。

        提交前请先搜索确认没有重复：[搜索现有 Issue](https://github.com/zhu1090093659/dsh-web/issues?q=is%3Aissue)
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: 提交前查重
      description: 提交前请先搜索确认没有重复的 Issue。
      options:
        - label: 我已搜索过 open/closed 的 Issue，确认本 Issue 没有重复。
          required: true
  - type: dropdown
    id: plugin
    attributes:
      label: 涉及插件
      description: 选择问题涉及的插件或区域。
      options:
        - 任务看板 (dsh-task-board)
        - Git 图谱 (dsh-git-graph)
        - 右侧面板 (dsh-aionui-panel)
        - 远程 Web UI (dsh-remote-web-ui)
        - SSH 远程运维 (dsh-ssh)
        - 宠物 (dsh-pet)
        - 皮肤 / 皮肤中心 (dsh-skins)
        - 创意工坊 / 市场 (dsh-market)
        - 壁纸 / 渲染器（Wallpaper Engine / WebGL / 背景场景）
        - 技能浏览器 (dsh-skill-explorer)
        - 性能监控 (dsh-perf)
        - 国际化多语言 (dsh-i18n)
        - 聚合包 / 安装 (dsh-web-all / dsh-web-settings)
        - 其他 / 不确定
    validations:
      required: true
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue 类型
      description: 本表单仅用于可复现的 Bug；功能请求请使用另一个表单。
      options:
        - Bug 报告
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 用一两句话描述 Bug。
      placeholder: 出了什么问题？
    validations:
      required: true
  - type: textarea
    id: expected-outcome
    attributes:
      label: 预期结果
      description: 描述应该发生什么。
      placeholder: 你期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: details-reproduction
    attributes:
      label: 详情 / 复现步骤
      description: 给出清晰的复现步骤。
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: DSH 版本、浏览器、插件名称与版本、操作系统及关键配置。
      placeholder: |
        - DSH 版本:
        - 浏览器:
        - 插件名称 / 版本:
        - 操作系统:
    validations:
      required: true
  - type: textarea
    id: bug-screenshot
    attributes:
      label: Bug 截图
      description: 粘贴或上传展示 Bug 的截图。无截图证据的 Bug 报告将被自动关闭。
      placeholder: 将图片拖到此处，或粘贴 GitHub 图片 / 文件链接。
    validations:
      required: true
  - type: textarea
    id: smoke-test
    attributes:
      label: 冒烟测试
      description: 说明你实际执行过的验证：按复现步骤在具体 DSH / 插件版本上的操作与观察结果、执行过的构建或命令、对照实验。未实际验证的描述视为无效。
      placeholder: |
        - 环境（DSH / 插件版本）:
        - 执行步骤与观察结果:
        - 对照 / 历史版本差异:
    validations:
      required: true
  - type: textarea
    id: code-reference
    attributes:
      label: 引用代码
      description: 指向仓库内相关代码的精确位置（文件路径 + 函数 / 行号，可附 GitHub 链接），便于维护者定位。
      placeholder: |
        packages/dsh-task-board/src/client/index.ts:120-135
        https://github.com/zhu1090093659/dsh-web/blob/main/packages/dsh-task-board/src/client/index.ts#L120-L135
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 如有日志、链接或其他上下文，请补充。
    validations:
      required: false
