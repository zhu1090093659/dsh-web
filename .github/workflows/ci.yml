name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts: the consistency checks below compare COMMITTED
      # bundle artifacts against the committed sources; a fresh build embeds
      # the checkout's absolute path into every bundle (CSS-module hashes
      # and \0dsh-css region markers), so rebuilt bytes would differ per
      # machine and make the check non-deterministic. The explicit Build step
      # below still verifies that everything builds.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Shared host copy consistency
        run: pnpm sync-shared:check

      - name: Skin center consistency
        run: pnpm skin-center:check

      - name: Community index consistency
        run: pnpm community:check

      # Fingerprints the committed lib/ bundles against the sources they were
      # built from; it must run BEFORE the Build step, which would otherwise
      # leave the working tree freshly rebuilt and mask a stale commit.
      - name: Committed lib artifact fingerprints
        run: pnpm libs:check

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test

      - name: Script tests
        run: pnpm test:scripts

      # The desktop payload helpers live outside the pnpm workspace; their
      # unit tests only need Node builtins.
      - name: Desktop runtime unit tests
        run: pnpm test:desktop

      - name: Runtime dependency check
        run: pnpm runtime-deps:check

      - name: Aggregate package consistency
        run: pnpm aggregate:check

      # The rule itself (ranges, out-of-scope trees, strict-UTF-8 handling) is a
      # reviewed, unit-tested script (pnpm test:scripts), so the identical check
      # runs locally and in CI.
      - name: Emoji rule
        run: pnpm emoji:check

      - name: Test standards
        run: pnpm test:standards

      - name: Documentation consistency
        run: pnpm docs:check

      - name: Bilingual dictionary consistency
        run: pnpm i18n:check

  # The desktop helpers encode win32 semantics (Path/PATH case variants,
  # NTFS junctions, Windows tmpdir layouts) that only a real Windows runner
  # exercises; the suite itself needs nothing but Node builtins.
  desktop-windows:
    name: Desktop unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # The suite needs Node builtins only. setup-node v5 defaults
      # package-manager-cache to true, which detects the pnpm lockfile and
      # demands pnpm on PATH — a tool this job never uses (first real run
      # failed there), so the default is switched off explicitly.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Desktop runtime unit tests
        run: node --test desktop/tests/*.test.mjs
        shell: bash

  # Pack the aggregate bundle as an npm tarball, mount it into a REAL DSH
  # instance through the official `dsh plugin --profile web add` channel, and
  # render the DSH web UI headlessly (Playwright Chromium) to prove the bundle
  # boots on the alpha cohort with no bundled right panel and no crash markers.
  # (aionui-panel is no longer supported and carries no assertions.)
  # Requires the published family packages (see docs/publish-prep.md for the
  # release order); runs keyless and deterministic, no API key needed.
  plugin-mount:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Pin the DSH CLI the lane mounts into; the profile's bundle stack
      # (dsh-base / dsh-web-app) resolves from this installation.
      - name: Install dsh CLI (pinned)
        run: npm install -g @deepseek-ai/dsh@0.1.7-alpha.1

      # lib/ bundles are committed for the consistency checks, but the
      # aggregate tarball must be produced from a fresh build.
      - name: Build
        run: pnpm build

      # Browser binaries are cached by lockfile hash (the playwright version
      # lives in the root package.json). The ubuntu-latest image already
      # ships Chromium's system libraries via its preinstalled Chrome, so
      # --with-deps is dropped on purpose: its apt run has hung on the
      # Ubuntu mirrors until the 30-minute job timeout killed it. The step
      # timeout keeps any future network hang a fast failure.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install chromium

      - name: Mount + headless-render smoke
        run: bash scripts/e2e-mount.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Direct pushes to the integration branch need the
  # "Validate PR contribution evidence" required check context to exist too;
  # on pull requests that context is produced by pr-contribution-rules.yml,
  # on pushes it is produced here so that branch protection does not block
  # collaborator pushes. PR-level evidence rules stay enforced by the
  # PR-only workflow.
  contribution-evidence:
    name: Validate PR contribution evidence
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Accept accepted integration push
        run: echo "integration branch push accepted; PR evidence stays enforced by pr-contribution-rules.yml on pull requests."
