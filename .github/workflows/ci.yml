name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts: the consistency checks below compare COMMITTED
      # bundle artifacts against the committed sources; a fresh build embeds
      # the checkout's absolute path into every bundle (CSS-module hashes
      # and \0dsh-css region markers), so rebuilt bytes would differ per
      # machine and make the check non-deterministic. The explicit Build step
      # below still verifies that everything builds.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Shared host copy consistency
        run: pnpm sync-shared:check

      - name: Skin center consistency
        run: pnpm skin-center:check

      - name: Community index consistency
        run: pnpm community:check

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test

      - name: Script tests
        run: pnpm test:scripts

      - name: Runtime dependency check
        run: pnpm runtime-deps:check

      - name: Aggregate package consistency
        run: pnpm aggregate:check

      - name: No emoji rule
        run: |
          python3 - <<'PY'
          import pathlib, sys
          ranges = [
              (0x1F000, 0x1FAFF),   # extended-B emoji
              (0x2600, 0x27BF),     # misc symbols + dingbats
              (0x2B00, 0x2BFF),     # supplemental arrows and misc symbols
              (0x1F1E6, 0x1F1FF),   # regional indicators
          ]
          singles = {0xFE0F, 0x200D}
          # dist holds committed generated artifacts (market/dist from
          # scripts/market-build, incl. vendored third-party bundles);
          # market/shell is the vendored try-on shell, not our source.
          # The emoji rule governs hand-written sources only.
          skip_dirs = {'.git', 'node_modules', 'lib', 'dist'}
          skip_prefixes = ('market/shell/',)
          skip_names = {'pnpm-lock.yaml'}
          skip_suffixes = {'.png', '.jpg', '.jpeg', '.gif', '.webp', '.ico', '.woff', '.woff2', '.ttf', '.otf', '.eot', '.pdf', '.zip', '.gz'}
          bad = []
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file():
                  continue
              if any(part in skip_dirs for part in p.parts):
                  continue
              if any(str(p).startswith(pre) for pre in skip_prefixes):
                  continue
              if p.name in skip_names or p.suffix.lower() in skip_suffixes:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              for i, ch in enumerate(text):
                  o = ord(ch)
                  if o in singles or any(lo <= o <= hi for lo, hi in ranges):
                      bad.append(f'{p}:{i + 1} U+{o:04X} {ch}')
          if bad:
              print('emoji rule violation:')
              for line in bad:
                  print('  ' + line)
              sys.exit(1)
          print('emoji rule passed')
          PY

      - name: Documentation consistency
        run: pnpm docs:check

  # Pack the aggregate bundle as an npm tarball, mount it into a REAL DSH
  # instance through the official `dsh plugin --profile web add` channel, and
  # render the DSH web UI headlessly (Playwright Chromium) to prove the
  # right-panel transition: dsh-better-sidebar mounts, no crash markers.
  # (aionui-panel is no longer supported and carries no assertions.)
  # Requires the published family packages and dsh-better-sidebar (see
  # docs/publish-prep.md for the release order); runs keyless and
  # deterministic, no API key needed.
  plugin-mount:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Pin the DSH CLI the lane mounts into; the profile's bundle stack
      # (dsh-base / dsh-web-app) resolves from this installation.
      - name: Install dsh CLI (pinned)
        run: npm install -g @deepseek-ai/dsh@0.1.2-alpha.4

      # lib/ bundles are committed for the consistency checks, but the
      # aggregate tarball must be produced from a fresh build.
      - name: Build
        run: pnpm build

      # Browser binaries are cached by lockfile hash (the playwright version
      # lives in the root package.json). The ubuntu-latest image already
      # ships Chromium's system libraries via its preinstalled Chrome, so
      # --with-deps is dropped on purpose: its apt run has hung on the
      # Ubuntu mirrors until the 30-minute job timeout killed it. The step
      # timeout keeps any future network hang a fast failure.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install chromium

      - name: Mount + headless-render smoke
        run: bash scripts/e2e-mount.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Direct pushes to the integration branch need the
  # "Validate PR contribution evidence" required check context to exist too;
  # on pull requests that context is produced by pr-contribution-rules.yml,
  # on pushes it is produced here so that branch protection does not block
  # collaborator pushes. PR-level evidence rules stay enforced by the
  # PR-only workflow.
  contribution-evidence:
    name: Validate PR contribution evidence
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Accept accepted integration push
        run: echo "integration branch push accepted; PR evidence stays enforced by pr-contribution-rules.yml on pull requests."
