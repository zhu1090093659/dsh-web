name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The DSH CLI the mount lane installs, in one place inside this workflow: this
# file is the only thing that installs it now, so the pin lives here rather
# than in a package.json dependency (a workspace devDependency cannot run in
# this tree; see the install step).
env:
  DSH_CLI_VERSION: 0.2.2-rc.2

# Four independent gates run in parallel and a fifth job aggregates them into
# the required "CI checks" context:
#
#   static-checks  text rules, typecheck and the build
#   unit-tests     the workspace suite, split into four shards
#   consistency    tree-wide consistency checks against the committed tree
#   team-hub       go vet and go test for the team-hub Go module
#   ci             fan-in: fails unless all four lanes returned success
#
# The lanes used to be steps of one job, which serialized ~4 minutes of
# independent work. They stay separate jobs rather than a matrix so each keeps
# its own timeout and its own step-level failure name.

jobs:
  # Lane 1 of 4: the tree-wide text rules, the type program and the build. The
  # three rule gates run after `pnpm install` but before Typecheck and Build, so
  # a contributor's most common violation still fails in seconds instead of
  # after a compile.
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Elastic checkout: a stalled clone is the most common flake in this
      # repository's runs and it is silent until the job timeout, so the first
      # attempt is capped at 3 minutes and allowed to fail; a failure drops the
      # partial .git and retries once with a 5-minute cap. The three steps
      # below are repeated verbatim in every job that checks out (ci.yml,
      # nightly.yml, release.yml); this is the one place that explains them.
      # They cannot be factored into a composite action because
      # `timeout-minutes` is not a key a composite action step may use.
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        continue-on-error: true
        timeout-minutes: 3

      - name: Drop a partial clone
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.9.0
          cache: pnpm

      # --ignore-scripts: the consistency checks in the consistency lane
      # compare COMMITTED bundle artifacts against the committed sources; a
      # fresh build embeds the checkout's absolute path into every bundle
      # (CSS-module hashes and \0dsh-css region markers), so rebuilt bytes would
      # differ per machine and make that check non-deterministic. Every lane
      # gets its own clean checkout, so the build at the end of THIS lane cannot
      # hide a stale commit from the consistency lane. The explicit Build step
      # below still verifies that everything builds.
      #
      # Every `pnpm <script>` step below runs after this install on purpose:
      # with node_modules absent, pnpm resolves the whole workspace and then
      # INSTALLS it before it starts the script, which measured 21.7s on the
      # runner (PR #1864, run 38506503973: the emoji script only began 21.7s
      # after pnpm printed the workspace scope) against about a second once
      # node_modules exists. Reproduced in a scratch copy outside the repo:
      # `pnpm emoji:check` took 34.0s with node_modules absent (its log shows
      # the implicit 429-package install) against 5.0s with it present, the raw
      # script being 0.6-1.2s. The explicit install is cheap on a warm store
      # (1-6s in those runs, 7.9s in the scratch copy).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The three rule gates below are tree-wide text scans over hand-written
      # sources: they need neither the built artifacts nor a type program, yet
      # they answer the failures a contributor most often has to fix (emoji,
      # test discipline, dictionary parity). Running them before Typecheck and
      # Build turns such a violation into a fast, well-named failure instead of
      # a red run that spent a minute compiling first. The rule itself (ranges,
      # out-of-scope trees, strict-UTF-8 handling) is a reviewed, unit-tested
      # script (pnpm test:scripts), so the identical check runs locally too.
      - name: Emoji rule
        run: pnpm emoji:check

      - name: Test standards
        run: pnpm test:standards

      - name: Bilingual dictionary consistency
        run: pnpm i18n:check

      # Oxlint, syntax-only: .oxlintrc.json scopes the scan to hand-written
      # sources and enables the defect-shaped rule categories (correctness,
      # suspicious, perf). The gate BLOCKS: the tree reached zero findings on
      # 2026-11-12 after the rule set was tuned to this codebase's idioms (nine
      # rules that conflict with sequential IO, spread updates, shadowed
      # identifiers and DOM handler assignment are off with their reasons in
      # .oxlintrc.json, and docs/archive/ is a frozen snapshot). A new finding
      # is therefore a regression, not standing debt, so there is no `|| true`.
      # It sits after the install because the binary comes from node_modules,
      # and before Typecheck because it is the cheaper of the two.
      - name: Lint (syntax only)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The one build in ci.yml. It belongs to this lane rather than the unit
      # lane: the suites that read built output (packages/dsh-web-all) load the
      # committed lib/ artifacts, and a fresh checkout already has them --
      # measured 2026-10-14 on a tree whose lib/ proved byte-identical to HEAD,
      # every workspace suite passed there with no build -- and the consistency
      # lane reads those same committed artifacts, so no lane needs freshly
      # built bytes before it runs.
      - name: Build
        run: pnpm build

  # Lane 2 of 4: the workspace suite, sharded so the four heaviest packages no
  # longer queue behind each other. scripts/test-shard.mjs owns the partition
  # (complete, disjoint, deterministic; asserted by scripts/test-shard.test.mjs
  # in pnpm test:scripts): it enumerates the test-bearing workspace packages,
  # assigns them to the requested shard by measured weight, and runs them with
  # bounded concurrency.
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One red shard must not cancel the other three before the aggregator has
      # seen their results.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      # Same elastic checkout as static-checks: 3-minute first attempt, one 5-minute retry.
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        continue-on-error: true
        timeout-minutes: 3

      - name: Drop a partial clone
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.9.0
          cache: pnpm

      # No build in this lane on purpose: see the Build step in static-checks.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Unit tests (shard ${{ matrix.shard }} of 4)
        run: node scripts/test-shard.mjs ${{ matrix.shard }} 4

  # Lane 3 of 4: the tree-wide consistency gates. This lane must never build:
  # libs:check fingerprints the COMMITTED lib/ bundles against the committed
  # sources they were built from, and a build would replace the working tree
  # with freshly built bytes before the comparison -- masking exactly the stale
  # commit the check exists to catch. That guarantee no longer depends on step
  # order inside one job: every job starts from its own clean checkout, so this
  # lane always sees the committed artifacts, whatever the other lanes do.
  consistency:
    name: Consistency gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Same elastic checkout as static-checks: 3-minute first attempt, one 5-minute retry.
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        continue-on-error: true
        timeout-minutes: 3

      - name: Drop a partial clone
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v5
        timeout-minutes: 5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Shared host copy consistency
        run: pnpm sync-shared:check

      - name: Committed lib artifact fingerprints
        run: pnpm libs:check

      - name: Aggregate package consistency
        run: pnpm aggregate:check

      - name: Documentation consistency
        run: pnpm docs:check

      - name: Runtime dependency check
        run: pnpm runtime-deps:check

      - name: Script tests
        run: pnpm test:scripts

  # Lane 4 of 4: team-hub/, one Go module. It sits outside the root pnpm
  # workspace and outside every other lane, so nothing above compiles or tests
  # it. The lane runs its work unconditionally: the Go toolchain is a runner
  # image concern, the module cache is keyed by team-hub/go/go.sum, and vet plus
  # test finish in seconds. The change probe this replaces existed to avoid a
  # one-minute dependency install, and it had to stay fail-open for every
  # unresolvable comparison; both costs are gone with the install.
  team-hub:
    name: Team hub (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Same elastic checkout as static-checks: 3-minute first attempt, one 5-minute retry.
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        continue-on-error: true
        timeout-minutes: 3

      - name: Drop a partial clone
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v5
        timeout-minutes: 5

      # go-version-file keeps the lane on the version team-hub/go/go.mod
      # declares, and the cache key follows that module's own sum file.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: team-hub/go/go.mod
          cache-dependency-path: team-hub/go/go.sum

      - name: Vet team-hub
        working-directory: team-hub/go
        run: go vet ./...

      - name: Test team-hub
        working-directory: team-hub/go
        run: go test ./...

  # Fan-in for the required "CI checks" context. Branch protection observes
  # THIS job, and the four lanes above are independent jobs, so the aggregate
  # fails unless every lane's result is exactly 'success'. The per-need check is
  # explicit rather than left to the default `needs` semantics: a skipped or
  # cancelled lane also leaves `needs` satisfied, and a required check must
  # never be satisfied by a lane that did not run.
  ci:
    name: CI checks
    if: always()
    needs: [static-checks, unit-tests, consistency, team-hub]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every lane to succeed
        env:
          LANE_STATIC_CHECKS: ${{ needs.static-checks.result }}
          LANE_UNIT_TESTS: ${{ needs.unit-tests.result }}
          LANE_CONSISTENCY: ${{ needs.consistency.result }}
          LANE_TEAM_HUB: ${{ needs.team-hub.result }}
        run: |
          failed=0
          for lane in LANE_STATIC_CHECKS LANE_UNIT_TESTS LANE_CONSISTENCY LANE_TEAM_HUB; do
            result="${!lane}"
            if [ "$result" = "success" ]; then
              echo "ok   ${lane}=${result}"
            else
              echo "::error::${lane} result is '${result}', not 'success'"
              failed=1
            fi
          done
          exit "$failed"

  # Pack the aggregate bundle as an npm tarball, mount it into a REAL DSH
  # instance through the official `dsh plugin --profile web add` channel, and
  # render the DSH web UI headlessly (Playwright Chromium) to prove the bundle
  # boots on the alpha cohort with no bundled right panel and no crash markers.
  # (aionui-panel is no longer supported and carries no assertions.)
  # Requires the published family packages (see docs/publish-prep.md for the
  # release order); runs keyless and deterministic, no API key needed.
  plugin-mount:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      # Same elastic checkout as static-checks: 3-minute first attempt, one 5-minute retry.
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        continue-on-error: true
        timeout-minutes: 3

      - name: Drop a partial clone
        if: steps.checkout.outcome == 'failure'
        run: rm -rf "$GITHUB_WORKSPACE/.git"

      - name: Checkout (retry)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v5
        timeout-minutes: 5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.9.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Pin the DSH CLI the lane mounts into; the profile's bundle stack
      # (dsh-base / dsh-web-app) resolves from this installation, and
      # env.DSH_CLI_VERSION above is the pin's single home inside this
      # workflow. Two alternatives were measured and rejected (PR #1864): a
      # cached prefix install cost 41-44s cold against 32s for this global
      # install, and a PR-scoped cache never restores on a first run; the CLI
      # as a workspace devDependency does not run in this tree at all
      # (dsh-app-boot declares @deepseek-ai/cordis-plugin-group as a peer while
      # the workspace sets autoInstallPeers: false), and npm's global install
      # resolves that peer.
      - name: Install dsh CLI (pinned)
        run: npm install -g "@deepseek-ai/dsh@$DSH_CLI_VERSION"

      # scripts/e2e-mount.sh resolves `dsh` through PATH and falls back to
      # `npx -y --package @deepseek-ai/dsh`, which would silently test an
      # unpinned CLI. Assert a CLI resolves AND reports the pinned version: the
      # global install path is runner-dependent, so the version is the check
      # that cannot pass on the wrong CLI. Measured 2026-10-14 on the pinned
      # install: `dsh --version` prints exactly the version, with no prefix.
      - name: Verify the pinned dsh CLI resolves
        run: |
          resolved="$(command -v dsh || true)"
          if [ -z "$resolved" ]; then
            echo "::error::no dsh on PATH: the mount smoke would fall back to npx with an unpinned CLI"
            exit 1
          fi
          if ! version="$(dsh --version 2>&1)"; then
            echo "::error::dsh --version failed at $resolved: $version"
            exit 1
          fi
          echo "dsh resolves to $resolved and reports $version"
          if [ "$version" != "$DSH_CLI_VERSION" ]; then
            echo "::error::dsh --version printed '$version', expected the pinned '$DSH_CLI_VERSION'"
            exit 1
          fi

      # lib/ bundles are committed for the consistency checks, but the
      # aggregate tarball must be produced from a fresh build.
      - name: Build
        run: pnpm build

      # Browser binaries are cached by lockfile hash (the playwright version
      # lives in the root package.json). The ubuntu-latest image already
      # ships Chromium's system libraries via its preinstalled Chrome, so
      # --with-deps is dropped on purpose: its apt run has hung on the
      # Ubuntu mirrors until the 30-minute job timeout killed it. The step
      # timeout keeps any future network hang a fast failure.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: pnpm exec playwright install chromium

      # Pack every family package from THIS checkout and smoke those builds
      # (FAMILY_TGZS_DIR full override): the published registry artifacts can
      # lag a freshly pinned host cohort — their bundled clients were built
      # for the previous one, so the registry path would test stale bits, not
      # this commit (0.1.7-alpha.2 transition turned this lane red on exactly
      # that skew). The release workflow keeps the registry consumer assertion.
      - name: Pack family tarballs from this checkout
        run: |
          mkdir -p "$RUNNER_TEMP/family-tgzs"
          for dir in packages/dsh-*; do
            (cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/family-tgzs" >/dev/null)
          done

      - name: Mount + headless-render smoke
        run: bash scripts/e2e-mount.sh
        env:
          FAMILY_TGZS_DIR: ${{ runner.temp }}/family-tgzs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Direct pushes to the integration branch need the
  # "Validate PR contribution evidence" required check context to exist too;
  # on pull requests that context is produced by pr-contribution-rules.yml,
  # on pushes it is produced here so that branch protection does not block
  # collaborator pushes. PR-level evidence rules stay enforced by the
  # PR-only workflow.
  contribution-evidence:
    name: Validate PR contribution evidence
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Accept accepted integration push
        run: echo "integration branch push accepted; PR evidence stays enforced by pr-contribution-rules.yml on pull requests."
