name: Update contributors

on:
  push:
    branches:
      - dev
      - main
  schedule:
    # Daily refresh in case contributors changed via merged PRs that did not
    # themselves trigger a push (e.g. force-pushed or rebased merges).
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-contributors:
    name: Sync contributor list into READMEs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          # GITHUB_TOKEN 无法绕过 integration-branch-policy（dev/main 要求 PR，
          # bypass 名单仅含两个用户），因此这里使用有 bypass 权限的 PAT；
          # checkout 会把该 token 持久化为 push 凭据，使 bot 能直接推到 dev，
          # 不再产生 chore/contributors-sync 分支和 PR。
          token: ${{ secrets.CONTRIBUTORS_PUSH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # packageManager in package.json pins pnpm, but this workflow never
          # installs dependencies; leave the package-manager cache off so
          # setup-node does not require a pnpm binary.
          package-manager-cache: false

      - name: Regenerate contributor sections
        run: |
          node scripts/update-contributors.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push to dev if changed
        run: |
          if git diff --quiet -- README.md README.en.md; then
            echo "Contributor list unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md
          git commit -m "docs(readme): sync contributor list from GitHub API"
          # 若期间 dev 有他人提交则先 rebase；push 由 checkout 持久化的 PAT
          # 执行（bypass 名单内用户），可直接进入 dev。
          git pull --rebase origin dev
          git push origin HEAD:dev
