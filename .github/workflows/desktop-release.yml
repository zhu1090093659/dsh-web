name: Desktop release

# Package the Electron desktop app and attach its installers to the GitHub
# Release of a vX.Y.Z tag. Runs automatically on every version tag (it waits
# for release.yml to create the Release first) and can be dispatched to
# (re)build assets for an existing tag; the optional ref input lets a
# dispatched run build a newer desktop tree than the tag itself.
#
# A windows-latest job boots the staged win-x64 payload first (bundled node +
# dsh host + GUI probe); the mac packaging job needs it, so a Windows boot
# failure stops the installers from reaching the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the assets to (vX.Y.Z)'
        required: true
        type: string
      ref:
        description: 'Git ref to build from (defaults to the tag)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Real Windows execution evidence before installers are built: stage the
  # same payload the mac job packages, then boot the bundled node.exe + dsh
  # host on an empty scratch DSH_HOME and probe the GUI. The mac job cannot
  # execute the win payload (presence checks only), so this gate is what
  # proves the zero-tooling claim on Windows.
  windows-smoke:
    name: Windows payload boot smoke
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Resolve release tag and checkout ref
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
            ref="${{ github.ref }}"
          else
            tag="$INPUT_TAG"
            ref="$INPUT_REF"
            if [ -z "$ref" ]; then ref="$tag"; fi
          fi
          case "$tag" in
            v*) ;;
            *) echo "tag must look like vX.Y.Z, got: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The packaged profile must pair with the release the tag publishes:
      # resolve the seed to the tagged aggregate before staging, so an
      # installer never ships plugins older than its own release. When the
      # npm publish lane is disabled the tagged version is not on the
      # registry — keep the committed seed and say so instead of failing.
      - name: Seed the profile payload with the tagged aggregate
        working-directory: desktop/runtime/profile-web
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          set -eu
          version="${TAG#v}"
          if npm view "@linxin666/dsh-web-all@${version}" version >/dev/null 2>&1; then
            npm pkg set "dependencies.@linxin666/dsh-web-all=${version}"
            echo "profile seed resolved to the tagged aggregate ${version}"
          else
            echo "the tagged aggregate ${version} is not on npm (publish lane disabled); keeping the committed seed"
          fi

      - name: Stage the bundled runtime payload
        working-directory: desktop
        run: npm run prepare-runtime
        shell: bash

      # PATH resolves the staged win-x64 distribution first, so node, npm,
      # and pnpm below run from inside the payload that ships to users.
      - name: Smoke-check the bundled toolchain
        working-directory: desktop
        shell: bash
        run: |
          set -eu
          export PATH="$PWD/resources/runtime/node-win-x64:$PATH"
          echo "node: $(command -v node) $(node --version)"
          echo "npm: $(command -v npm) $(npm --version)"
          echo "pnpm: $(command -v pnpm) $(pnpm --version)"

      - name: Boot the staged host and probe the GUI
        working-directory: desktop
        shell: bash
        run: |
          set -eu
          NODE="$PWD/resources/runtime/node-win-x64/node.exe"
          HOST="$PWD/resources/runtime/host/node_modules/@deepseek-ai/dsh/lib/bin.js"
          SMOKE_HOME="$RUNNER_TEMP/dsh-smoke-home"
          SMOKE_PORT=3987
          rm -rf "$SMOKE_HOME"
          mkdir -p "$SMOKE_HOME"
          DSH_HOME="$SMOKE_HOME" "$NODE" "$HOST" --version
          DSH_HOME="$SMOKE_HOME" "$NODE" "$HOST" web --no-open --host 127.0.0.1 --port "$SMOKE_PORT" \
            > "$SMOKE_HOME/host.log" 2>&1 &
          HOST_PID=$!
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$SMOKE_PORT/" || true)
            if [ "$code" != "000" ] && [ -n "$code" ] && [ "$code" -lt 500 ]; then
              echo "the GUI answers with HTTP $code after ${i}s"
              kill "$HOST_PID" 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 "$HOST_PID" 2>/dev/null; then
              echo "the host exited before the GUI became ready" >&2
              tail -40 "$SMOKE_HOME/host.log" >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo "the GUI did not answer within 120s" >&2
          tail -40 "$SMOKE_HOME/host.log" >&2 || true
          kill "$HOST_PID" 2>/dev/null || true
          exit 1

  desktop:
    name: Package desktop app
    needs: windows-smoke
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Resolve release tag and checkout ref
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
            ref="${{ github.ref }}"
          else
            tag="$INPUT_TAG"
            ref="$INPUT_REF"
            if [ -z "$ref" ]; then ref="$tag"; fi
          fi
          case "$tag" in
            v*) ;;
            *) echo "tag must look like vX.Y.Z, got: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # The packaged payload is resolved from the registry at build time
      # (desktop/runtime/*/package.json pins), so building a tag whose seed
      # was later advanced is done by checking out that newer ref, not by
      # moving the tag.
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # Same seed pairing as the windows-smoke job: the installers must carry
      # the aggregate the tag publishes, not whatever the committed seed was.
      - name: Seed the profile payload with the tagged aggregate
        working-directory: desktop/runtime/profile-web
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        shell: bash
        run: |
          set -eu
          version="${TAG#v}"
          if npm view "@linxin666/dsh-web-all@${version}" version >/dev/null 2>&1; then
            npm pkg set "dependencies.@linxin666/dsh-web-all=${version}"
            echo "profile seed resolved to the tagged aggregate ${version}"
          else
            echo "the tagged aggregate ${version} is not on npm (publish lane disabled); keeping the committed seed"
          fi

      - name: Stage the bundled runtime payload
        working-directory: desktop
        run: npm run prepare-runtime

      # Prove the bundled toolchain actually executes before installers are
      # built: PATH resolves the staged mac-arm64 distribution first, so node,
      # npm, and pnpm below run from inside the payload that ships to users
      # (a machine with zero preinstalled tooling must be able to run
      # `dsh plugin add`). The win payload is presence-checked by
      # build-runtime.mjs's staged assertions; it cannot execute on macOS.
      - name: Smoke-check the bundled toolchain
        working-directory: desktop
        run: |
          set -eu
          export PATH="$PWD/resources/runtime/node-mac-arm64/bin:$PATH"
          echo "node: $(command -v node) $(node --version)"
          echo "npm: $(command -v npm) $(npm --version)"
          echo "pnpm: $(command -v pnpm) $(pnpm --version)"

      - name: Wait for the GitHub Release to exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -eu
          for i in $(seq 1 60); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release $TAG found"
              exit 0
            fi
            echo "waiting for release $TAG (attempt $i/60)"
            sleep 20
          done
          echo "Release $TAG did not appear within 20 minutes; release.yml likely failed" >&2
          exit 1

      # Align the app version with the release tag so artifact names carry
      # it (dsh-desktop-X.Y.Z-*); the edit stays runner-local.
      - name: Stamp the release version into the app manifest
        working-directory: desktop
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # Explicit arch flags: bare `dist` lets electron-builder default to the
      # host arch (arm64) for Windows, which the staged payload does not cover.
      - name: Build mac and Windows installers
        working-directory: desktop
        run: |
          npm run dist:mac
          npm run dist:win

      - name: Upload the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -eu
          cd desktop/dist
          ls -la ./*.dmg ./*.exe ./*.zip
          gh release upload "$TAG" ./*.dmg ./*.exe ./*.zip --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
