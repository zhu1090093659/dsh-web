packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
ignoreWorkspaceRootCheck: true

supportedArchitectures:
  os:
    - darwin
    - win32
  cpu:
    - x64
    - arm64

# cloudflared fetches its binary for the build platform; node-pty checks its
# shipped prebuilds. cpu-features and ssh2 only build an optional native
# accelerator with a pure-JS fallback, so they are approved as skipped.
allowBuilds:
  cloudflared: true
  cpu-features: false
  node-pty: true
  ssh2: false

minimumReleaseAgeExclude:
  - 'dsh-better-sidebar@0.18.0'
  - '@linxin666/dsh-client-ui-community-plugins@0.3.19'
  - '@linxin666/dsh-client-ui-git-graph@0.3.19'
  - '@linxin666/dsh-client-ui-market@0.3.19'
  - '@linxin666/dsh-client-ui-plugin-manager@0.3.19'
  - '@linxin666/dsh-client-ui-skill-explorer@0.3.19'
  - '@linxin666/dsh-client-ui-skin-center@0.3.19'
  - '@linxin666/dsh-client-ui-task-board@0.3.19'
  - '@linxin666/dsh-client-ui-web-ui-settings@0.3.19'
  - '@linxin666/dsh-doctor@0.3.19'
  - '@linxin666/dsh-i18n@0.3.19'
  - '@linxin666/dsh-liangshen@0.3.19'
  - '@linxin666/dsh-pet@0.3.19'
  - '@linxin666/dsh-remote-web-ui@0.3.19'
  - '@linxin666/dsh-session-archive@0.3.19'
  - '@linxin666/dsh-ssh@0.3.19'
  - '@linxin666/dsh-tool-describe-image@0.3.19'
  - '@linxin666/dsh-usage@0.3.19'
  - '@linxin666/dsh-web-all@0.3.19'
  - '@linxin666/dsh-client-ui-model-capabilities@0.3.19'
  - '@linxin666/dsh-client-ui-preset-center@0.3.19'
