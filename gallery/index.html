  /* 主题色只在 hover/active 时出现（见样式表末尾统一规则），primary 不单独着色 */
  .btn.ghost { flex: 0 0 auto; }
  .empty-state {
    min-height: 260px;
    display: flex; align-items: center; justify-content: center;
    color: var(--g-muted); font-size: 14px;
    border-top: 1px solid rgba(213, 231, 250, .12);
    border-bottom: 1px solid rgba(213, 231, 250, .12);
  }
  .empty-state[hidden], .grid[hidden] { display: none; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  @media (max-width: 1350px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 1020px) {
    .wrap { padding-inline: 24px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .filter-bar { align-items: stretch; flex-wrap: wrap; }
    .search-field { flex: 1 1 280px; }
    .result-count { display: flex; align-items: center; }
  }
  @media (max-width: 680px) {
    .wrap { padding: 0 16px 56px; }
    header.top { min-height: 50svh; padding: 40px 0 32px; }
    .brand-row { gap: 18px; }
    .brand-row .whale { width: 72px; height: 72px; }
    .brand-row .whale svg { width: 38px; height: 38px; }
    h1 { font-size: 32px; line-height: 1.14; }
    .hero-actions { align-items: stretch; flex-direction: column; }
    .hero-link { width: 100%; }
    .install-command { width: 100%; }
    .install-command code { font-size: 10.5px; }
    .install-command button { margin-left: 10px; }
    .filter-bar { gap: 10px; margin-bottom: 16px; padding: 9px; }
    .search-field { flex: 1 1 100%; min-width: 0; }
    .filter-segments {
      flex: 1 1 auto; min-width: 0; overflow-x: auto;
      scrollbar-width: none; overscroll-behavior-inline: contain;
    }
    .filter-segments::-webkit-scrollbar { display: none; }
    .filter-segments button { flex: none; }
    .result-count { margin-left: 0; padding: 0 5px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
  }

  /* --- 预览模态框：窗口 + 横条整体垂直居中，开合带动画 -------------------------- */
  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: none;
    background: rgba(6, 12, 24, .72);
    opacity: 0;
    transition: opacity .3s ease; /* 背景与窗口开合动画同步淡入淡出 */
  }
  .modal.open { opacity: 1; }
  /* 预览窗口：1280×720 原生尺寸展示（不缩放），打开时淡入放大，关闭时反向 */
  .preview-window {
    position: absolute; left: 50%; top: 50%;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.94);
    transition: opacity .25s ease, transform .3s cubic-bezier(.2,.7,.2,1);
  }
  .modal.open .preview-window { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .frame-box {
    position: relative; /* 锚定全屏加载层，只覆盖预览窗口本身 */
    width: 1280px; height: 720px;
    border: 1px solid rgba(213, 231, 250, .18);
    border-radius: 22px; overflow: hidden;
    box-shadow: var(--g-shadow);
  }
  .frame-box iframe {
    width: 1280px; height: 720px; display: block; border: 0;
    border-radius: 20px; background: #0a1526;
    opacity: 0; /* 加载完成后 .ready 淡入（同卡片缩略图） */
    transition: opacity .3s ease;
  }
  .frame-box iframe.ready { opacity: 1; }
  /* 全屏加载层：覆盖整个预览窗口，淡入出现、完成后淡出 */
  .frame-loading {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: rgba(10, 21, 38, .92);
    color: var(--g-muted); font-size: 13px;
    opacity: 1; visibility: visible;
    transition: opacity .25s ease, visibility 0s; /* 出现：visibility 立即可见，让淡入生效 */
    pointer-events: none;
  }
  .frame-loading.hide {
    opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility 0s linear .25s; /* 隐藏：等淡出完再隐藏 */
  }
  .frame-loading .spinner { width: 18px; height: 18px; }
  .spinner {
    width: 12px; height: 12px; border-radius: 15px;
    border: 2px solid var(--g-line); border-top-color: var(--g-accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .spinner { animation: none; }
    .install-command button .check-icon path, .btn .check-icon path { animation: none; }
    .shot::before { animation: none; }
  }
  /* 底部悬浮横条（苹果式，单行）：材质/高度/圆角与搜索筛选横条一致 */
  .floating-bar {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    flex-wrap: nowrap;
    max-width: calc(100vw - 36px);
    min-height: 62px; padding: 10px 12px;
    border: 1px solid rgba(213, 231, 250, .14); border-radius: 32px;
    background: rgba(7, 14, 25, .66);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 14px 40px rgba(0, 4, 12, .45);
    -webkit-backdrop-filter: saturate(125%) blur(22px);
    backdrop-filter: saturate(125%) blur(22px);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .25s ease, transform .3s cubic-bezier(.2,.7,.2,1);
  }
  .modal.open .floating-bar { opacity: 1; transform: translateY(0); }
  /* 内部按钮：与筛选分段按钮一致（高 34px，圆角 22px 由 CORNER_OVERRIDES 统一） */
  .floating-bar .fbtn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 13px;
    border: 0; border-radius: 15px; background: transparent;
    color: var(--g-muted); font-size: 12.5px; cursor: pointer;
    transition: color .16s ease, background .16s ease, box-shadow .16s ease;
  }
  .floating-bar .fbtn svg { width: 15px; height: 15px; flex: none; }
  /* 明暗切换按钮：太阳/月亮图标与文案叠放互切，带淡入旋转过渡 */
  .floating-bar .fbtn .ico { position: relative; width: 15px; height: 15px; flex: none; }
  .floating-bar .fbtn .ico svg {
    position: absolute; inset: 0; width: 15px; height: 15px;
    transition: opacity .2s ease, transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .floating-bar .fbtn .ico .moon { opacity: 0; transform: scale(.5) rotate(-30deg); }
  .floating-bar .fbtn.dark .ico .sun { opacity: 0; transform: scale(.5) rotate(30deg); }
  .floating-bar .fbtn.dark .ico .moon { opacity: 1; transform: none; }
  .floating-bar .fbtn .lbl { position: relative; }
  .floating-bar .fbtn .lbl .l-light {
    position: absolute; left: 0; top: 0; opacity: 0;
    transition: opacity .2s ease;
  }
  .floating-bar .fbtn .lbl .l-dark { transition: opacity .2s ease; }
  .floating-bar .fbtn.dark .lbl .l-dark { opacity: 0; }
  .floating-bar .fbtn.dark .lbl .l-light { opacity: 1; }
  .floating-bar .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; min-height: 0; padding: 0 13px;
    border: 0; border-radius: 15px; background: transparent;
    color: var(--g-muted); font-size: 12.5px;
  }
  .floating-bar .btn .copy-label { display: inline-flex; align-items: center; gap: 6px; }
  .floating-bar .btn .copy-label svg { width: 15px; height: 15px; flex: none; }
  /* 信息面板：点击「信息」弹出，左对齐横条，出现/消失带动画 */
  .info-panel {
    position: absolute; left: 0; bottom: calc(100% + 10px);
    width: 300px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    border: 1px solid rgba(213, 231, 250, .16);
    border-radius: 30px;
    background: rgba(10, 18, 32, .94);
    box-shadow: 0 14px 40px rgba(0, 4, 12, .5);
    -webkit-backdrop-filter: blur(18px) saturate(125%);
    backdrop-filter: blur(18px) saturate(125%);
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .22s ease, transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .info-panel.open { opacity: 1; transform: none; pointer-events: auto; }
  .info-panel .tagline { min-height: 0; margin: 0; }
  .info-panel .tags { flex-wrap: wrap; min-height: 0; }
  .info-panel .author {
    display: flex; align-items: center; gap: 7px;
    color: var(--g-muted); font-size: 12.5px;
  }
  .info-panel .author[hidden] { display: none; }
  .info-panel .author svg { width: 13px; height: 13px; flex: none; }
  /* 关闭按钮：SVG 图标 + 正圆形，hover 红色 */
  .close-x {
    border: 0 !important; background: transparent;
    display: inline-flex; align-items: center; justify-content: center;
    width: 34px; height: 34px; padding: 0 !important;
    border-radius: 50% !important;
    color: var(--g-faint);
    transition: background-color .16s ease, color .16s ease;
  }
  .close-x svg { width: 16px; height: 16px; }
  .floating-bar .close-x:hover { background: #e5484d; color: #fff; } /* 关闭悬停红色 */
  @media (max-width: 520px) {
    .floating-bar { gap: 6px; padding: 7px 10px; }
    .floating-bar .fbtn, .floating-bar .btn { padding: 0 10px; font-size: 12px; }
  }

  /* --- temporary background tuner ------------------------------------------ */
  .fx-tuner-toggle {
    position: fixed; right: 18px; bottom: 18px; z-index: 80;
    min-width: 96px; height: 34px; padding: 0 12px;
    border: 1px solid rgba(58, 101, 194, .34); border-radius: 15px;
    background: rgba(7, 17, 33, .88); color: #c9def5;
    box-shadow: 0 8px 24px rgba(0, 5, 16, .42);
    backdrop-filter: blur(12px); font: 12px var(--g-font); cursor: pointer;
  }
  .fx-tuner-toggle:hover { background: rgba(18, 39, 68, .94); }
  .fx-tuner {
    position: fixed; right: 18px; bottom: 60px; z-index: 80;
    width: min(300px, calc(100vw - 24px)); overflow: hidden;
    border: 1px solid rgba(58, 101, 194, .24); border-radius: 15px;
    background: rgba(7, 17, 33, .94); color: #d8e7f7;
    box-shadow: 0 18px 48px rgba(0, 4, 14, .58);
    backdrop-filter: blur(18px);
  }
  .fx-tuner[hidden] { display: none; }
  .fx-tuner-head, .fx-tuner-actions {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  }
  .fx-tuner-head { border-bottom: 1px solid rgba(58, 101, 194, .14); }
  .fx-tuner-head strong { font-size: 13px; font-weight: 600; }
  .fx-dark-ratio {
    margin-left: auto; color: #8eb9e7; font: 11px var(--g-mono);
    font-variant-numeric: tabular-nums;
  }
  .fx-tuner-close {
    width: 26px; height: 26px; padding: 0; border: 0; border-radius: 15px;
    background: transparent; color: #8ea7c2; font-size: 18px; cursor: pointer;
  }
  .fx-tuner-close:hover { background: rgba(58, 101, 194, .18); color: #e6eef8; }
  .fx-tuner-controls { display: grid; gap: 12px; padding: 12px; }
  .fx-control { display: grid; gap: 5px; }
  .fx-control > span { display: flex; justify-content: space-between; gap: 12px; color: #aac0d8; font-size: 11.5px; }
  .fx-control output { color: #e6f1fc; font: 11px var(--g-mono); font-variant-numeric: tabular-nums; }
  .fx-control input[type="range"] { width: 100%; margin: 0; accent-color: var(--g-accent); cursor: pointer; }
  .fx-tuner-actions { border-top: 1px solid rgba(58, 101, 194, .14); }
  .fx-tuner-actions button {
    flex: 1; height: 30px; border: 1px solid rgba(58, 101, 194, .20); border-radius: 15px;
    background: rgba(58, 101, 194, .12); color: #c9def5; font: 11.5px var(--g-font); cursor: pointer;
  }
  .fx-tuner-actions button:hover { background: rgba(58, 101, 194, .22); }
  @media (max-width: 520px) {
    .fx-tuner-toggle { right: 12px; bottom: 12px; }
    .fx-tuner { right: 12px; bottom: 54px; }
  }

  /* --- 按钮 hover / active 统一 ----------------------------------------------
     hover 一律用主题色，active 用加深的主题色变体（--g-accent-active）。
     覆盖所有 button（.shot 是卡片预览区，不算按钮）与按钮型链接 .hero-link；
     放在样式表末尾以统一优先级，各组件旧 hover 规则已被本块取代。 */
  button:not(.shot):hover, .hero-link:hover {
    background: var(--g-accent);
    border-color: var(--g-accent);
    color: #fff;
    text-decoration: none;
  }
  button:not(.shot):active, .hero-link:active {
    background: var(--g-accent-active);
    border-color: var(--g-accent-active);
    color: #fff;
  }

  /* --- 卡片列表过渡 ----------------------------------------------------------
     筛选/搜索变化时：新卡片淡入上浮，消失的卡片淡出缩小，存活的卡片
     FLIP 从旧位置平滑滑到新位置（动画期间 tilt 让位，见 JS 的 flipping 保护） */
  .card.card-in { animation: card-in .32s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes card-in { from { opacity: 0; transform: translateY(10px); } }
  .card.card-out { animation: card-out .24s ease both; pointer-events: none; }
  @keyframes card-out { to { opacity: 0; transform: scale(.95); } }

  /* --- 滚动条：深色窄条风格，无上下箭头 -------------------------------------- */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(213, 231, 250, .2);
    border: 2px solid transparent;
    border-radius: 8px;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(213, 231, 250, .34);
    border: 2px solid transparent;
    border-radius: 8px;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  ::-webkit-scrollbar-corner { background: transparent; }
  @-moz-document url-prefix() {
    html { scrollbar-width: thin; scrollbar-color: rgba(213, 231, 250, .28) transparent; }
  }

  /* 卡片操作按钮：图标 + 文字并排居中；copy-label 需 inline-flex 让图标与文字
     按盒对齐（默认 inline 时 svg 按基线排导致文字偏下 2px）。字形微调：
     中文/拉丁字形相对行框有固定偏移（canvas actualBoundingBox 实测） */
  .card .actions .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8.7px 10px 7.3px; /* 内容下移 0.7px：中文字形偏上 ≈0.7px */
  }
  .card .actions .btn .btn-icon { width: 14px; height: 14px; flex: none; transform: translateY(-.5px); }
  .card .actions .btn .copy-label { display: inline-flex; align-items: center; gap: 6px; }

  /* 文字字形级垂直居中微调（canvas actualBoundingBox 实测）：拉丁文本约居中
     不处理；中文字形（雅黑行框渲染）偏上 0.6~1.2px 逐项下移；搜索框
     placeholder 偏下 1px 上移 */
  .filter-segments button { padding: 1.2px 13px 0; } /* 文本下移 1.2px：中文字形偏上（实测） */
  .floating-bar .fbtn span, .result-count { transform: translateY(.6px); }

</style>
</head>

      </span>
      <h1><span>DeepSeek Harness</span> <span>主题库</span></h1>

<script>
(function () {
  'use strict'

  var manifest = window.SKIN_MANIFEST
  var skins = (manifest && manifest.skins) || []
  var grid = document.getElementById('grid')
  var emptyState = document.getElementById('emptyState')
  var resultCount = document.getElementById('resultCount')
  var searchInput = document.getElementById('skinSearch')
  var filterSegments = document.getElementById('filterSegments')
  var filters = {
    retro: ['retro', 'qq', '2008', 'nostalgia', 'xp', 'luna', 'windows', 'start-button'],
    work: ['stock', 'trading', 'terminal', 'ticker', 'live', 'longbridge'],
    art: ['dreamskin', 'whale', 'indigo', 'art', 'translucent', 'dragon', 'loong', 'chinese', 'ink-wash', 'great-wall', 'ocean', 'ice-blue', 'goddess', 'miku', 'vocaloid', 'music', 'idol', 'waveform'],
    game: ['minecraft', 'voxel', 'pixel', 'game', 'panorama', 'skybox'],
  }
  var galleryState = { filter: 'all', query: '' }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { fallbackCopy(text) })
    }
    fallbackCopy(text)
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea')
    ta.value = text
    document.body.appendChild(ta)
    ta.select()
    try { document.execCommand('copy') } catch (e) { /* ignore */ }
    ta.remove()
  }

  var heroInstallCommand = document.getElementById('heroInstallCommand')
  var heroInstallCopy = document.getElementById('heroInstallCopy')
  var heroInstallResetTimer = 0
  heroInstallCopy.addEventListener('click', function () {
    copy(heroInstallCommand.textContent)
    window.clearTimeout(heroInstallResetTimer)
    heroInstallCopy.classList.add('copied')
    heroInstallCopy.setAttribute('aria-label', '安装命令已复制')
    heroInstallCopy.setAttribute('title', '安装命令已复制')
    heroInstallResetTimer = window.setTimeout(function () {
      heroInstallCopy.classList.remove('copied')
      heroInstallCopy.setAttribute('aria-label', '复制安装命令')
      heroInstallCopy.setAttribute('title', '复制安装命令')
    }, 1400)
  })

  // --- 卡片 ----------------------------------------------------------------
  var cardPool = {} // 渲染过的卡片按 id 缓存：筛选切回时复用，缩略图不重新加载

  function createCard(s) {
    var card = document.createElement('article')
    card.className = 'card'
    card.setAttribute('data-corn', 'surface')
    card.dataset.id = s.id // 供列表过渡（FLIP / 增删动画）按皮肤追踪卡片

    var shot = document.createElement('button')
    shot.type = 'button'
    shot.className = 'shot'
    shot.setAttribute('data-corn', 'none')
    shot.setAttribute('aria-label', '预览 ' + s.name)
    var light = document.createElement('img')
    light.className = 'light'
    light.src = '../' + s.preview.light
    light.alt = s.name + ' 亮色预览'
    light.loading = 'lazy'
    light.addEventListener('load', function () {
      shot.classList.add('loaded')
      light.classList.add('thumb-in') // 一次性淡入动画，播完移除（复用卡片不会重播）
      light.addEventListener('animationend', function () { light.classList.remove('thumb-in') }, { once: true })
    })
    light.addEventListener('error', function () {
      this.style.display = 'none'
      shot.classList.add('no-thumb')
    })
    var dark = document.createElement('img')
    dark.className = 'dark'
    dark.src = '../' + s.preview.dark
    dark.alt = s.name + ' 暗色预览'
    dark.loading = 'lazy'
    dark.onerror = function () { this.style.display = 'none' }
    shot.append(light, dark)
    shot.addEventListener('click', function () { openModal(s) })
    card.appendChild(shot)

    var body = document.createElement('div')
    body.className = 'body'
    var nameRow = document.createElement('div')
    nameRow.className = 'name-row'
    var h3 = document.createElement('h3')
    h3.textContent = s.name
    nameRow.appendChild(h3)

    var author = document.createElement('div')
    author.className = 'author'
    author.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'
    var authorName = document.createElement('span')
    authorName.textContent = s.author || ''
    author.appendChild(authorName)

    var actions = document.createElement('div')
    actions.className = 'actions'
    var tryBtn = document.createElement('button')
    tryBtn.type = 'button'
    tryBtn.className = 'btn primary'
    tryBtn.innerHTML = '<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg><span>预览</span>'
    tryBtn.addEventListener('click', function () { openModal(s) })
    var useBtn = document.createElement('button')
    useBtn.type = 'button'
    useBtn.className = 'btn'
    useBtn.innerHTML = '<span class="copy-label"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>复制命令</span>' +
      '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg>'
    useBtn.addEventListener('click', function () {
      copy('dsh-skin use ' + s.id)
      useBtn.classList.add('copied')
      window.clearTimeout(useBtn._resetTimer)
      useBtn._resetTimer = window.setTimeout(function () { useBtn.classList.remove('copied') }, 1400)
    })
    actions.append(tryBtn, useBtn)
    body.append(nameRow, author, actions)
    card.appendChild(body)
    initCardTilt(card)
    cardPool[s.id] = card
    return card
  }

  // --- 卡片 3D 倾斜 + 边缘光效 ------------------------------------------------
  // 光标进入卡片后：按光标位置实时倾斜（perspective 透视，TILT_MAX 为最大倾角），
  // 鼠标所在的一侧朝观者靠近；同时把光标坐标写入 --gx/--gy，驱动 ::after 的
  // 描边光晕跟随。进入/离开用内联 transition 控制平滑度：进入 0.12s 起倾、
  // 跟随 0.05s 跟手、离开 0.4s 缓动复位，复位完成（transitionend）后交还 CSS。
  var TILT_MAX = 8
  var TILT_PERSPECTIVE = 900
  var GLOW_RADIUS = 220 // 与 CSS .card::after 的 radial-gradient 半径保持一致
  var TILT_ENTER = 'transform .3s ease-out, border-color .22s ease, box-shadow .22s ease, background .22s ease'
  var TILT_FOLLOW = 'transform .05s linear'
  var TILT_RETURN = 'transform .6s cubic-bezier(.2,.7,.2,1), border-color .22s ease, box-shadow .22s ease, background .22s ease'
  var TILT_ENTER_HOLD = 250 // 进入后保持 TILT_ENTER 的时长（ms），让起倾动画可见再切跟手

  function initCardTilt(card) {
    var moved = false
    var enteredAt = 0
    card.addEventListener('mousemove', function (e) {
      if (card.classList.contains('flipping')) return // 列表重排动画期间让位
      var r = card.getBoundingClientRect()
      var x = (e.clientX - r.left) / r.width
      var y = (e.clientY - r.top) / r.height
      var rx = (y - 0.5) * 2 * TILT_MAX  // 鼠标在上方 → 上边朝观者靠近
      var ry = (0.5 - x) * 2 * TILT_MAX  // 鼠标在左侧 → 左边朝观者靠近
      var tilt = 'perspective(' + TILT_PERSPECTIVE + 'px) rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) translateY(-2px)'
      if (!moved) {
        moved = true
        enteredAt = performance.now()
        card.classList.add('tilting')
        // 同一帧改 transition 又改 transform 不会触发过渡：先强制样式重算，
        // 让过渡参数生效，再写 transform 才会启动过渡动画
        card.style.transition = TILT_ENTER
        void card.offsetWidth
        card.style.transform = tilt
        card.style.setProperty('--gx', (x * 100).toFixed(2) + '%')
        card.style.setProperty('--gy', (y * 100).toFixed(2) + '%')
      } else {
        // 进入后短暂保持 TILT_ENTER，让起倾动画完整可见，之后才切换跟手速度
        card.style.transition = (performance.now() - enteredAt < TILT_ENTER_HOLD) ? TILT_ENTER : TILT_FOLLOW
        card.style.transform = tilt
        card.style.setProperty('--gx', (x * 100).toFixed(2) + '%')
        card.style.setProperty('--gy', (y * 100).toFixed(2) + '%')
      }
    })
    card.addEventListener('mouseleave', function () {
      if (card.classList.contains('flipping')) return
      moved = false
      card.classList.remove('tilting')
      card.style.transition = TILT_RETURN
      void card.offsetWidth // 先让 0.4s 过渡参数生效，再清 transform 才会缓动复位
      card.style.transform = ''
      card.style.removeProperty('--gx')
      card.style.removeProperty('--gy')
    })
    card.addEventListener('transitionend', function (e) {
      if (e.propertyName !== 'transform' || moved) return
      card.style.transition = '' // 复位动画结束，交还 CSS 过渡
    })
  }

  function matchesFilter(s) {
    if (galleryState.filter === 'all') return true
    var wanted = filters[galleryState.filter] || []
    return (s.tags || []).some(function (tag) { return wanted.indexOf(tag) !== -1 })
  }

  function matchesQuery(s) {
    if (!galleryState.query) return true
    var haystack = [
      s.name, s.nameEn, s.author, s.tagline, s.description,
      (s.tags || []).join(' '),
    ].join(' ').toLocaleLowerCase()
    return haystack.indexOf(galleryState.query) !== -1
  }

  // 卡片列表过渡：消失的卡片先淡出（其他卡片原地不动），淡出完成后
  // 存活卡片 FLIP 滑动与进入卡片淡入同步进行（全程过渡、禁止闪现）。
  // FLIP 目标位置必须在消失卡片移除后的布局上测量；滑动用 WAAPI 动画。
  var gridExitTimer = 0 // 消失阶段结束计时

  function renderGrid() {
    var visible = skins.filter(function (s) {
      return matchesFilter(s) && matchesQuery(s)
    })

    // 取消上一轮未完成的流程，卡片回到干净状态（连续输入时动画让位于新动画）
    window.clearTimeout(gridExitTimer)
    Array.prototype.forEach.call(grid.children, function (el) {
      el.classList.remove('card-out', 'card-in', 'flipping')
      el.style.transform = ''
    })

    var oldCards = Array.prototype.slice.call(grid.children)
    var oldById = {}
    var first = {}
    oldCards.forEach(function (el) {
      oldById[el.dataset.id] = el
      first[el.dataset.id] = el.getBoundingClientRect()
    })
    var newById = {}
    visible.forEach(function (s) { newById[s.id] = true })

    // 初次渲染：直接淡入，不拆阶段
    if (oldCards.length === 0) {
      visible.forEach(function (s) {
        var el = createCard(s)
        el.classList.add('card-in')
        grid.appendChild(el)
        window.setTimeout(function () { el.classList.remove('card-in') }, 340)
      })
      grid.hidden = visible.length === 0
      emptyState.hidden = visible.length !== 0
      resultCount.textContent = visible.length + ' 个主题'
      applyCorners()
      return
    }

    var leaving = oldCards.filter(function (el) { return !newById[el.dataset.id] })
    var entering = visible.filter(function (s) { return !oldById[s.id] })

    // 消失卡片移除后：存活卡片 FLIP 滑动 + 进入卡片淡入同步进行
    function reflow() {
        visible.forEach(function (s) {
          var el = oldById[s.id]
          if (!el) {
            // 优先复用曾渲染过的卡片：缩略图已加载，直接显示不再淡入，
            // 避免"图闪一下"（淡入动画会让已加载的图先消失再出现）
            el = cardPool[s.id]
            if (el) {
              el.classList.remove('card-out', 'card-in', 'flipping')
              el.style.transform = ''
            } else {
              el = createCard(s)
              el.classList.add('card-in') // 仅真正新建的卡片淡入
              window.setTimeout(function () { el.classList.remove('card-in') }, 340)
            }
          }
          grid.appendChild(el) // 按可见顺序移动/追加，布局就位
        })
      visible.forEach(function (s) {
        var el = oldById[s.id]
        if (!el) return
        var old = first[s.id]
        var now = el.getBoundingClientRect() // 此时消失卡片已移除，位置即最终位置
        var dx = old.left - now.left
        var dy = old.top - now.top
        if (dx || dy) {
          // WAAPI 动画：从旧位置滑到新位置，确定性播放（不依赖过渡起点提交，
          // 避免 transform 不影响布局时 offsetWidth 强制重排失效导致"闪过去"）
          el.classList.add('flipping') // tilt 让位
          var anim = el.animate(
            [{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }],
            { duration: 320, easing: 'cubic-bezier(.2,.7,.2,1)' }
          )
          anim.onfinish = function () { el.classList.remove('flipping') }
          window.setTimeout(function () { el.classList.remove('flipping') }, 400) // 兜底清理
        }
      })
      grid.hidden = visible.length === 0
      emptyState.hidden = visible.length !== 0
      resultCount.textContent = visible.length + ' 个主题'
      applyCorners()
    }

    if (leaving.length === 0) {
      reflow() // 无消失：直接重排
    } else {
      leaving.forEach(function (el) { el.classList.add('card-out') })
      gridExitTimer = window.setTimeout(function () {
        leaving.forEach(function (el) { el.remove() }) // 淡出完再移除，布局才会重排
        reflow()
      }, 240)

  }

    '  float rippleDust = clamp(max(totalRing, totalInner * 0.88), 0.0, 1.0);',
    '  vec3 dustLayer = starLayer(',
    '    dustP, 66.0, 4.7, t * 0.68,',
    '    0.816 - rippleDust * 0.176, 0.10, flowDir, f);',
    '  vec3 brightLayer = starLayer(',
    '    starP, 37.0, 19.3, t * 0.78,',
    '    0.904 - rippleDust * 0.272, 0.08, flowDir, swirl * 2.0 - 1.0);',
    '  vec3 rippleLayer = starLayer(',
    '    starP - rippleCdir * 0.12, 48.0, 52.6, t * 0.74,',
    '    0.976 - rippleDust * 0.576, 0.08, flowDir, f);',
    '  col += vec3(0.64, 0.80, 1.00) * dustLayer.x * nebula * (0.28 + tone2 * 0.44);',
    '  col += vec3(0.76, 0.88, 1.00) * brightLayer.x * nebula * (0.42 + swirl * 0.36);',
    '  col += vec3(0.82, 0.92, 1.00) * rippleLayer.x * rippleDust * 1.46;',
    '  float randomTwinkle =',
    '    dustLayer.y * 0.48 +',
    '    brightLayer.y * 0.92 +',
    '    rippleLayer.y * rippleDust * 1.05;',
    '  col += vec3(0.78, 0.94, 1.00) * randomTwinkle;',
    '',
    '  float flareMask = clamp(tone2 * 0.76 + tone3 * 0.24, 0.0, 1.0);',
    '  float fastFlare =',
    '    dustLayer.z * 0.62 +',
    '    brightLayer.z * 1.12 +',
    '    rippleLayer.z * rippleDust * 1.28;',
    '  col += vec3(0.94, 1.08, 1.24) * fastFlare * (0.52 + flareMask * 0.82);',
    '',
    '  float vignette = 1.0 - smoothstep(0.48, 1.06, length((uv - 0.5) * vec2(0.86, 1.0)));',
    '  col *= 0.82 + vignette * 0.18;',
    '  col = pow(max(col, 0.0), vec3(0.94));',
    '  gl_FragColor = vec4(col, 1.0);',
    '}',
  ].join('\n')

  function compile(type, src) {
    var shader = gl.createShader(type)
    gl.shaderSource(shader, src)
    gl.compileShader(shader)
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(shader))
    }
    return shader
  }

  function buildResources() {
    var vs = compile(gl.VERTEX_SHADER, VERT)
    var fs = compile(gl.FRAGMENT_SHADER, FRAG)
    prog = gl.createProgram()
    gl.attachShader(prog, vs)
    gl.attachShader(prog, fs)
    gl.linkProgram(prog)
    gl.deleteShader(vs)
    gl.deleteShader(fs)
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(prog))
    }
    gl.useProgram(prog)

    var buf = gl.createBuffer()
    gl.bindBuffer(gl.ARRAY_BUFFER, buf)
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
    var aPos = gl.getAttribLocation(prog, 'aPos')
    gl.enableVertexAttribArray(aPos)
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0)

    uRes = gl.getUniformLocation(prog, 'uRes')
    uTime = gl.getUniformLocation(prog, 'uTime')
    uClicks = gl.getUniformLocation(prog, 'uClicks')
    uClicksT = gl.getUniformLocation(prog, 'uClicksT')
    uClicksFade = gl.getUniformLocation(prog, 'uClicksFade')
    uScroll = gl.getUniformLocation(prog, 'uScroll')
    uFxA = gl.getUniformLocation(prog, 'uFxA')
    uFxB = gl.getUniformLocation(prog, 'uFxB')
  }

  try {
    buildResources()
  } catch (err) {
    return
  }

  var rendererInfo = gl.getExtension('WEBGL_debug_renderer_info')
  var rendererName = rendererInfo ? gl.getParameter(rendererInfo.UNMASKED_RENDERER_WEBGL) : ''
  var softwareRenderer = /swiftshader|llvmpipe|software/i.test(rendererName)

  function resize() {
    W = canvas.clientWidth || window.innerWidth
    H = canvas.clientHeight || window.innerHeight
    var nativeDpr = Math.min(window.devicePixelRatio || 1, 1.5)
    var maxPixels = softwareRenderer ? 400000 : 2400000
    var pixelBudget = Math.sqrt(maxPixels / Math.max(1, W * H))
    var renderDpr = Math.min(nativeDpr, pixelBudget)
    canvas.width = Math.max(1, Math.round(W * renderDpr))
    canvas.height = Math.max(1, Math.round(H * renderDpr))
    gl.viewport(0, 0, canvas.width, canvas.height)
    gl.uniform2f(uRes, canvas.width, canvas.height)
    if (reduceMotion) draw()
  }
  window.addEventListener('resize', resize)

  window.addEventListener('pointerdown', function (e) {
    if (clicks.length >= CLICK_MAX) return // 已有 3 个波纹：不产生新波纹，等淡出到 ≤3
    clicks.push({ x: e.clientX, y: e.clientY, t: 0, fade: -1 }) // -1 = 正常播放
    // 新波纹出现：之前的波纹从 0 开始 0.5s 淡出（而不是瞬间消失）
    for (var i = 0; i < clicks.length - 1; i++) clicks[i].fade = 0
  }, { passive: true })

  var tuner = document.getElementById('fxTuner')
  var tunerToggle = document.getElementById('fxTunerToggle')
  var tunerClose = document.getElementById('fxTunerClose')
  var tunerReset = document.getElementById('fxTunerReset')
  var tunerCopy = document.getElementById('fxTunerCopy')
  var darkRatio = document.getElementById('fxDarkRatio')
  var tunerInputs = tuner ? tuner.querySelectorAll('[data-fx]') : []
  var measureTimer = 0

  function syncTuner() {
    Array.prototype.forEach.call(tunerInputs, function (input) {
      var key = input.getAttribute('data-fx')
      input.value = fx[key]
      var output = tuner.querySelector('[data-fx-output="' + key + '"]')
      if (output) output.textContent = Number(fx[key]).toFixed(2)
    })
  }

  function measureDarkPixels() {
    if (!darkRatio || !W || !H || contextLost) return
    draw()
    gl.finish()
    var pixels = new Uint8Array(canvas.width * canvas.height * 4)
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels)
    var dark = 0
    var total = 0
    for (var y = 0; y < canvas.height; y += 8) {
      for (var x = 0; x < canvas.width; x += 8) {
        var i = (y * canvas.width + x) * 4
        var luminance = pixels[i] * 0.2126 + pixels[i + 1] * 0.7152 + pixels[i + 2] * 0.0722
        if (luminance < 40) dark++
        total++
      }
    }
    darkRatio.textContent = '暗部 ' + Math.round(dark / Math.max(1, total) * 100) + '%'
  }

  function scheduleDarkMeasure() {
    clearTimeout(measureTimer)
    measureTimer = setTimeout(measureDarkPixels, 180)
  }

  function setTunerOpen(open) {
    if (!tuner || !tunerToggle) return
    tuner.hidden = !open
    tunerToggle.setAttribute('aria-expanded', String(open))
    tunerToggle.textContent = open ? '收起参数' : '背景参数'
    if (open) scheduleDarkMeasure()
  }

  function fallbackCopyFx(text) {
    var ta = document.createElement('textarea')
    ta.value = text
    document.body.appendChild(ta)
    ta.select()
    try { document.execCommand('copy') } catch (err) { /* ignore */ }
    ta.remove()
  }

  function copyFxValues() {
    var text = Object.keys(fxDefaults).map(function (key) {
      return key + '=' + Number(fx[key]).toFixed(2)
    }).join('\n')
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function () { fallbackCopyFx(text) })
    } else {
      fallbackCopyFx(text)
    }
    tunerCopy.textContent = '已复制'
    setTimeout(function () { tunerCopy.textContent = '复制参数' }, 1200)
  }

  if (tuner && tunerToggle) {
    syncTuner()
    tuner.addEventListener('pointerdown', function (e) { e.stopPropagation() })
    tunerToggle.addEventListener('pointerdown', function (e) { e.stopPropagation() })
    tunerToggle.addEventListener('click', function () {
      setTunerOpen(tuner.hidden)
    })
    tunerClose.addEventListener('click', function () { setTunerOpen(false) })
    tunerReset.addEventListener('click', function () {
      fx = Object.assign({}, fxDefaults)
      syncTuner()
      draw()
      scheduleDarkMeasure()
    })
    tunerCopy.addEventListener('click', copyFxValues)
    Array.prototype.forEach.call(tunerInputs, function (input) {
      input.addEventListener('input', function () {
        var key = input.getAttribute('data-fx')
        fx[key] = Number(input.value)
        syncTuner()
        draw()
        scheduleDarkMeasure()
      })
    })
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !tuner.hidden) setTunerOpen(false)
    })
  }

  function draw() {
    if (contextLost || !prog || !W || !H) return
    gl.useProgram(prog)
    gl.uniform1f(uTime, time)
    var cA = [], tA = [], fA = []
    for (var i = 0; i < 3; i++) {
      var c = clicks[i] || { x: -10, y: -10, t: 1e4, fade: -1 } // 空槽：t 极大 → 波纹强度为 0
      cA.push(c.x / W, 1 - c.y / H)
      tA.push(c.t)
      fA.push(c.fade)
    }
    gl.uniform2fv(uClicks, cA)
    gl.uniform1fv(uClicksT, tA)
    gl.uniform1fv(uClicksFade, fA)
    gl.uniform1f(uScroll, reduceMotion ? 0 : scroll.smooth)
    gl.uniform4f(uFxA, fx.brightThreshold, fx.stretch, fx.scale, fx.contrast)
    gl.uniform2f(uFxB, fx.brightness, fx.speed)
    gl.drawArrays(gl.TRIANGLES, 0, 3)
  }

  function stop() {
    running = false
    cancelAnimationFrame(raf)
  }

  function frame(now) {
    if (!running) return
    raf = requestAnimationFrame(frame)
    var dt = Math.min((now - last) / 1000, 0.05)
    if (!(dt > 0)) dt = 0.016
    last = now
    time += dt
    clicks.forEach(function (c) {
      c.t += dt
      if (c.fade >= 0) c.fade = Math.min(CLICK_FADE, c.fade + dt) // 淡出计时
    })
    clicks = clicks.filter(function (c) { return c.fade < CLICK_FADE }) // 淡出完的移除
    scroll.target = window.scrollY || 0
    scroll.smooth += (scroll.target - scroll.smooth) * Math.min(1, dt * 2.4)
    draw()
  }

  function start() {
    if (running || reduceMotion || document.hidden || contextLost) return
    running = true
    last = performance.now()
    raf = requestAnimationFrame(frame)
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stop()
    } else {
      start()
    }
  })
  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault()
    contextLost = true
    stop()
  })
  canvas.addEventListener('webglcontextrestored', function () {
    contextLost = false
    try {
      buildResources()
      resize()
      draw()
      start()
    } catch (err) {
      contextLost = true
    }
  })

  resize()
  if (reduceMotion) {
    time = 7.2
    draw()
  } else {
    draw()
    start()
  }
  canvas.classList.add('ready') // 首帧已绘制：背景淡入，避免加载时背景突然出现
})();
</script>

</body>
</html>
