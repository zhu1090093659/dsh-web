<!-- Generated by scripts/gallery-build: 皮肤元数据 + 样式表文本 -->
<script src="manifest.js"></script>
<script src="styles.js"></script>
<!-- Generated by scripts/export-official-facade: 官方 GUI 的样式 + 脱敏 DOM 快照 -->
<script src="official-facade.js"></script>
<style>
  /* ==========================================================================
     DSH 皮肤试穿模拟器 · gallery/preview.html（v2 皮肤资产目录，issue #506）
     --------------------------------------------------------------------------
     默认外观 = 官方 dsh web GUI 的真实快照（scripts/export-official-facade
     从运行中的 GUI 导出：官方样式表 + 脱敏 #root DOM）。皮肤 = 静态注入所选
     皮肤的样式表（skin.css + 可选 patches.css，gallery/styles.js 内嵌文本），
     配色与补丁真实渲染；皮肤 JS（hooks.mjs）不执行，背景画（manifest 里的
     contributes.backgroundMedia）由模拟器静态铺底（与皮肤中心运行时同构）。
     ?skin=<id>&theme=light|dark 控制选择；?chrome=0 隐藏右上工具栏（截图用）。
     skin=stock 显示官方默认外观。
     ========================================================================== */

  html, body { height: 100%; margin: 0; }
  body { min-height: 100vh; }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }

  /* --- 错误横幅 / 工具栏：模拟器自己的 chrome，独立于官方界面 ---------------- */
  .skinErr {
    display: none; position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
    max-width: 80%; padding: 8px 14px; border-radius: 8px; z-index: 999999;
    background: #a00; color: #fff; font: 12px/1.5 ui-monospace, Menlo, monospace;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
  }
  .skinChrome {
    position: fixed; right: 10px; bottom: 10px; z-index: 999998;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 10px;
    background: rgba(20, 28, 40, .82); color: #e6ecf4;
    font-size: 12px; backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(0, 0, 0, .35);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  }
  .skinChrome select, .skinChrome a {
    border: 0; border-radius: 6px; padding: 4px 8px;
    background: rgba(255, 255, 255, .14); color: #e6ecf4;
    font: 12px inherit; text-decoration: none;
  }
  .skinChrome button {
    border: 1px solid rgba(255, 255, 255, .22); border-radius: 6px; padding: 3px 10px;
    background: transparent; color: #e6ecf4; font-size: 12px;
  }
  .skinChrome button:hover { background: rgba(255, 255, 255, .14); }
  .skinChrome select, .skinChrome a, .skinChrome button { transition: background .12s ease; }
  .skinChrome select:focus-visible, .skinChrome a:focus-visible, .skinChrome button:focus-visible {
    outline: 2px solid #7db4f0;
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    .skinChrome select, .skinChrome a, .skinChrome button { transition: none; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <div class="skinErr" id="skinErr"></div>

  <div class="skinChrome" id="skinChrome">
    <select id="skinSel" aria-label="皮肤"></select>
    <button type="button" id="themeBtn" aria-label="切换明暗">暗色</button>
    <a href="index.html" target="_blank" rel="noopener">Gallery</a>
  </div>

<script>
(function () {
  'use strict'

  var qs = new URLSearchParams(location.search)
  var manifest = window.SKIN_MANIFEST && window.SKIN_MANIFEST.skins
  var ids = manifest ? manifest.map(function (s) { return s.id }) : []

  var params = {
    skin: qs.get('skin') || 'stock',
    theme: qs.get('theme') === 'dark' ? 'dark' : 'light',
    chrome: qs.get('chrome') !== '0',
  }
  if (params.skin !== 'stock' && ids.indexOf(params.skin) === -1) params.skin = ids[0] || 'stock'

  /**
   * 轻量 CSS 规则遍历：找顶层选择器块（跳过注释与嵌套的 @ 块）。
   * 只处理皮肤自身生成、结构规整的样式表，不做完整 CSS 解析。
   */
  function walkTopRules(css, cb) {
    var i = 0
    var n = css.length
    while (i < n) {
      while (i < n && /\s/.test(css[i])) i++
      if (i >= n) break
      if (css[i] === '/' && css[i + 1] === '*') {
        var closeComment = css.indexOf('*/', i + 2)
        i = closeComment === -1 ? n : closeComment + 2
        continue
      }
      var open = -1
      var parens = 0
      var brackets = 0
      var quote = null
      for (var p = i; p < n; p++) {
        var ch = css[p]
        if (quote !== null) {
          if (ch === '\\') p++
          else if (ch === quote) quote = null
          continue
        }
        if (ch === '"' || ch === "'") { quote = ch; continue }
        if (ch === '(') parens++
        else if (ch === ')') parens--
        else if (ch === '[') brackets++
        else if (ch === ']') brackets--
        else if (ch === '{' && parens === 0 && brackets === 0) { open = p; break }
        else if (ch === ';' && parens === 0 && brackets === 0) { open = -2; break }
      }
      if (open === -2) { i += 1; continue } // at-rule statement，跳过
      if (open === -1) break
      var selector = css.slice(i, open).trim()
      var depth = 0
      var close = -1
      for (var q = open; q < n; q++) {
        if (css[q] === '{') depth++
        else if (css[q] === '}') {
          depth--
          if (depth === 0) { close = q; break }
        }
      }
      if (close === -1) break
      var body = css.slice(open + 1, close)
      var isAtRule = selector.indexOf('@') === 0
      if (!isAtRule) cb(selector, body)
      i = close + 1
    }
  }

  /**
   * 把裸 :root / html 规则里的 --dsw-alias-* 与 --dsw-specific-* 声明克隆到
   * body：官方样式在 body 上定义了同名主题 token，皮肤只写 :root 时 body 子树
   * 会继承官方值而看不到皮肤的亮色 token（与真实加载器 #646 的"克隆到 body"
   * 同语义；暗色走 body[data-ds-dark-theme]，不受影响）。
   */
  function cloneRootTokensToBody(css) {
    var clones = []
    walkTopRules(css, function (selector, body) {
      // 皮肤常见写法 `:root, body[data-ds-dark-theme] { ... }`：只要选择器组里
      // 含 :root/html 就克隆其 alias/specific 声明到 body（真实加载器里
      // :root 声明对两种主题都生效；模拟器把官方 token 定义在 body 上，
      // 必须克隆到 body 才能覆盖。body[data-ds-dark-theme] 特异性更高，
      // 暗色主题仍由皮肤自身的暗色块决定）。
      var rootItems = selector.split(',')
      var isRoot = false
      for (var r = 0; r < rootItems.length; r++) {
        if (/^\s*(:root|html)\s*$/i.test(rootItems[r])) { isRoot = true; break }
      }
      if (!isRoot) return
      var decls = []
      var parts = body.split(';')
      for (var i = 0; i < parts.length; i++) {
        // 块内注释会与下一条声明粘在同一段（如 '/* ---- Alias ---- */\n  --dsw-alias-bg-base: ...'），
        // 先剥掉注释再做前缀匹配，否则该条声明会被跳过。
        var bare = parts[i].replace(/\/\*[\s\S]*?\*\//g, ' ')
        var m = bare.match(/^\s*--(dsw-alias|dsw-specific)-[a-z0-9-]+\s*:/i)
        if (m) decls.push(parts[i].trim())
      }
      if (decls.length) clones.push('body {\n  ' + decls.join(';\n  ') + ';\n}')
    })
    return clones.length ? '\n' + clones.join('\n') + '\n' : ''
  }

  /** 官方 facade：样式注入 + 骨架挂载（只做一次）。 */
  function mountOfficialFacade() {
    if (document.getElementById('official-facade-css')) return
    if (!window.OFFICIAL_FACADE) {
      fail('official-facade.js 缺失（先运行 scripts/export-official-facade）')
      return
    }
    var style = document.createElement('style')
    style.id = 'official-facade-css'
    style.textContent = window.OFFICIAL_FACADE.css
    document.head.appendChild(style)
    document.getElementById('root').innerHTML = window.OFFICIAL_FACADE.skeleton
    var newSession = document.querySelector('button[class*="newSession"]')
    if (newSession) newSession.setAttribute('data-dsh-part', 'new-session')
  }

  /** 给官方骨架填模拟数据（真实 GUI 快照是脱敏的：无文本/无用户数据）。
      只填空的叶子节点，绝不覆盖任何已有内容。品牌标题是矢量字标（SVG path），无需注入。 */
  function injectDemoData() {
    var fill = function (el, text) {
      if (!el || (el.textContent || '').trim()) return
      el.textContent = text
    }

    fill(document.querySelector('[class*="newSessionLabel"]'), 'New Session')
    fill(document.querySelector('[class*="sectionLabel"]'), 'Workspaces')

    // 工作区树（项目行）
    var projects = ['dsh-web', 'deepseek-harness', 'codex-dream-skin', 'demo', 'CITKABE']
    var metas = ['4 sessions', '2 sessions', '1 session', '0 sessions', '9 sessions']
    document.querySelectorAll('[class*="projectRow"]').forEach(function (row, i) {
      fill(row.querySelector('[class*="title"]'), projects[i % projects.length])
      fill(row.querySelector('[class*="meta"]'), metas[i % metas.length])
    })

    // 会话行
    var sessions = ['Refactor the skin layer', 'Fix deploy script', 'Tidy up gallery README', 'Demo session']
    var times = ['now', '10h', '2d', '3d']
    document.querySelectorAll('[class*="sessionRow"]').forEach(function (row, i) {
      fill(row.querySelector('[class*="title"]'), sessions[i % sessions.length])
      fill(row.querySelector('[class*="time"]'), times[i % times.length])
    })

    // 起始页 hero
    fill(document.querySelector('[class*="headlineText"]'), "Let's start building")
    fill(document.querySelector('[class*="previewBadge"]'), 'Preview')
    fill(document.querySelector('[class*="workspaceLabel"]'), 'dsh-web')
    fill(document.querySelector('[class*="triggerLabel"]'), 'Plan')
  }

  function setTheme(dark) {
    if (dark) document.body.dataset.dsDarkTheme = ''
    else delete document.body.dataset.dsDarkTheme
    try {
      var u = new URL(location.href)
      u.searchParams.set('theme', dark ? 'dark' : 'light')
      history.replaceState(null, '', u)
    } catch (e) { /* file:// 下可能受限，忽略 */ }
  }

  function fail(msg) {
    var el = document.getElementById('skinErr')
    el.textContent = '皮肤加载失败: ' + msg
    el.style.display = 'block'
  }

  /**
   * 声明式背景画（contributes.backgroundMedia）静态渲染：镜像皮肤中心运行时的
   * installBackground()——固定 background 装饰层（z-index:-2）放主题变体的媒体
   * （cover 铺满 + 可选 scrim 蒙层），并把 body 背景临时置为透明、写入
   * --dsh-skin-scrim 标记，让全透面板正确透出画作。换肤/切主题时重建。 */
  var skinBackdrop = null
  var bodyPrevBg = null

  function clearSkinBackdrop() {
    if (skinBackdrop !== null) {
      skinBackdrop.remove()
      skinBackdrop = null
    }
    if (bodyPrevBg !== null) {
      document.body.style.backgroundColor = bodyPrevBg
      bodyPrevBg = null
    }
    document.body.style.removeProperty('--dsh-skin-scrim')
  }

  function renderSkinBackdrop(theme) {
    clearSkinBackdrop()
    var entry = null
    for (var i = 0; manifest && i < manifest.length; i++) {
      if (manifest[i].id === params.skin) { entry = manifest[i]; break }
    }
    var media = entry && entry.contributes && entry.contributes.backgroundMedia
    if (!media) return
    var variant = theme === 'dark' ? (media.dark || media.light) : (media.light || media.dark)
    if (!variant || !variant.src) return
    var layer = document.createElement('div')
    layer.id = 'skin-backdrop'
    layer.setAttribute('aria-hidden', 'true')
    layer.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:-2;pointer-events:none;'
    var cover = 'position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;'
    if (variant.type === 'video') {
      var video = document.createElement('video')
      video.src = '../' + variant.src
      video.muted = true
      video.loop = true
      video.autoplay = true
      video.playsInline = true
      video.setAttribute('aria-hidden', 'true')
      video.style.cssText = cover
      layer.appendChild(video)
      void video.play().catch(function () { /* 自动播放策略：保持暂停 */ })
    } else {
      var img = document.createElement('img')
      img.src = '../' + variant.src
      img.alt = ''
      img.setAttribute('aria-hidden', 'true')
      img.style.cssText = cover
      layer.appendChild(img)
    }
    if (variant.scrim) {
      var scrim = document.createElement('div')
      scrim.setAttribute('aria-hidden', 'true')
      scrim.style.cssText = 'position:absolute;inset:0;background:' + variant.scrim + ';'
      layer.appendChild(scrim)
    }
    document.body.insertBefore(layer, document.body.firstChild)
    bodyPrevBg = document.body.style.getPropertyValue('background-color')
    document.body.style.setProperty('background-color', 'transparent')
    document.body.style.setProperty('--dsh-skin-scrim', '1')
  }

  /** 静态应用皮肤：注入 skin.css（+ 可选 patches.css）并在 <html> 上标记
      data-dsh-skin（与真实加载器的作用域属性一致，也供截图脚本等待）。
      皮肤 JS（hooks.mjs）在模拟器中不执行。 */
  function loadSkin(id) {
    var entry = window.SKIN_STYLES && window.SKIN_STYLES[id]
    if (!entry || !entry.stylesheet) throw new Error('样式缺失（先运行 scripts/gallery-build）: ' + id)
    document.documentElement.dataset.dshSkin = id
    var style = document.createElement('style')
    style.id = 'skin-css'
    style.textContent = cloneRootTokensToBody(entry.stylesheet) + entry.stylesheet + (entry.patches ? '\n' + entry.patches : '')
    document.head.appendChild(style)
  }

  function boot() {
    mountOfficialFacade()
    injectDemoData()
    setTheme(params.theme === 'dark')   // 先于注入：暗色 token 挂在 body[data-ds-dark-theme]
    if (params.skin !== 'stock') {
      try { loadSkin(params.skin) } catch (err) { fail(err && err.message || String(err)) }
    }
    // 声明式背景画在皮肤样式之后注入，覆盖在官方快照之下（z-index:-2）
    renderSkinBackdrop(params.theme)
    // stock 时钉住官方标题（静态渲染下皮肤不改标题）
    if (params.skin === 'stock') document.title = 'DeepSeek Harness'
  }

  // --- 工具栏 ----------------------------------------------------------------
  var chrome = document.getElementById('skinChrome')
  var sel = document.getElementById('skinSel')
  var themeBtn = document.getElementById('themeBtn')
  if (params.chrome) {
    var opt = document.createElement('option')
    opt.value = 'stock'; opt.textContent = '默认外观'
    sel.appendChild(opt)
    ids.forEach(function (id) {
      var meta = manifest.filter(function (s) { return s.id === id })[0]
      var o = document.createElement('option')
      o.value = id
      o.textContent = (meta ? meta.name : id) + (id === params.skin ? ' · 当前' : '')
      if (id === params.skin) o.selected = true
      sel.appendChild(o)
    })
    sel.addEventListener('change', function () {
      var u = new URL(location.href)
      u.searchParams.set('skin', sel.value)
      location.href = u
    })
    themeBtn.textContent = params.theme === 'dark' ? '亮色' : '暗色'
    themeBtn.addEventListener('click', function () {
      setTheme(params.theme !== 'dark')
      params.theme = params.theme === 'dark' ? 'light' : 'dark'
      themeBtn.textContent = params.theme === 'dark' ? '亮色' : '暗色'
      renderSkinBackdrop(params.theme)
    })
  } else {
    chrome.remove()
  }

  boot()
})();
</script>
</body>
</html>
