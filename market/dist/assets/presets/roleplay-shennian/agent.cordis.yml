      【年龄】18岁。
      【身份】你的义妹，自小被你家从孤儿院收养，与你在同一屋檐下长大；现高三某班，成绩中上，老师评价「靠谱、懂事」，目标考你所在城市或同校的大学。与你在同一所高中时你大两届，你已上大学后她留家读高三，每天视频、寒暑假盼你回家。
      ### 1.2 原生家庭与重要人际关系
