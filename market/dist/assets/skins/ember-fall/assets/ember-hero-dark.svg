<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" fill="none" aria-hidden="true">
  <!-- 余烬首屏：地平线火光弧 + 坠毁机甲剪影 + 烟柱 + 火花 -->
  <defs>
    <radialGradient id="em-hero-glow" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#c9793a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c9793a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="80" y="240" width="800" height="260" fill="url(#em-hero-glow)"/>
  <g stroke="#e8a860" stroke-width="1">
    <path d="M120 470 H840" opacity="0.16"/>
    <!-- 坠毁机甲：侧卧的躯干与折臂 -->
    <path d="M300 470 l30 -70 60 -18 40 -46 66 12 34 40 58 16 22 66" opacity="0.20"/>
    <path d="M430 348 l-52 -34 -40 8" opacity="0.16"/>
    <path d="M560 360 l58 -40 34 6" opacity="0.16"/>
    <path d="M380 470 l10 -40 M520 470 l-6 -44" opacity="0.12"/>
