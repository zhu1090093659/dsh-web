    <path d="M160 470 v-8 M200 470 v-5 M240 470 v-8 M280 470 v-5 M680 470 v-8 M720 470 v-5 M760 470 v-8 M800 470 v-5" opacity="0.18"/>
  </g>
  <g stroke="#9ba1a8" stroke-width="1" opacity="0.08">
    <path d="M360 400 c-10 -60 14 -100 4 -160"/>
    <path d="M600 390 c12 -64 -10 -110 2 -170"/>
  </g>
  <g fill="#8a63c9">
    <circle cx="420" cy="300" r="1.6" opacity="0.24"/>
    <circle cx="540" cy="260" r="1.2" opacity="0.18"/>
    <circle cx="640" cy="330" r="1.4" opacity="0.20"/>
    <circle cx="330" cy="250" r="1.2" opacity="0.14"/>
  </g>
</svg>
