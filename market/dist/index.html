/* =========================================================================
   创意工坊 · market/src/index.html
   深海画廊版式：沉浸式海洋背景、编辑式导语、人气推荐陈列与四列作品网格。
   ========================================================================= */
:root {
  color-scheme: dark;
  --bg: #050c15;
  --panel: #0c1724;
  --line: #24384d;
  --line-strong: #3a5471;
  --muted: #a4b0c2;
  --faint: #8497af;
  --text: #f0f3fa;
  --blue: #72aaff;
  --accent: #4b97ff;
  --accent-2: #3475e6;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --serif: 'Songti SC', 'Noto Serif SC', Georgia, serif;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 var(--font);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select { font: inherit; }
button { cursor: pointer; color: inherit; border: 0; background: none; }
a { color: inherit; text-decoration: none; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid #93beff; outline-offset: 4px;
}
img { max-width: 100%; }

/* ---------- ocean backdrop ---------- */
.ocean {
  position: fixed; inset: 0; z-index: -1;
  width: 100%; height: 100vh; height: 100dvh;
  overflow: hidden; background: #030b14;
  contain: paint; isolation: isolate;
}
#bgCanvas {
  display: block; width: 100%; height: 100%;
  opacity: 0; transition: opacity .5s ease; pointer-events: none;
  filter: saturate(.65) brightness(.72);
}
#bgCanvas.ready { opacity: .42; }
.whale-overlay {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  mix-blend-mode: screen; -webkit-mix-blend-mode: screen;
}
.whale-overlay .ocean-image {
  position: absolute; right: -1%; top: -25px;
  width: min(1120px, 82vw); height: auto;
  opacity: .88; filter: saturate(.72) brightness(.85);
  -webkit-mask-image: radial-gradient(ellipse 80% 70% at 76% 9%, #000 12%, #000b 42%, transparent 79%);
  mask-image: radial-gradient(ellipse 80% 70% at 76% 9%, #000 12%, #000b 42%, transparent 79%);
  transform-origin: 78% 20%;
  animation: sea-drift 15s ease-in-out infinite alternate;
  will-change: transform;
}
.whale-overlay .ocean-light {
  position: absolute; right: -4%; top: -170px; width: 65%; height: 540px;
  opacity: .22; filter: blur(28px); mix-blend-mode: screen;
  background: conic-gradient(from 156deg at 70% 0%, transparent 0deg, #66baff14 5deg, transparent 11deg, #7bc5ff18 18deg, transparent 25deg, #70bbff12 32deg, transparent 40deg);
  transform-origin: 70% 0%;
  animation: light-drift 12s ease-in-out infinite alternate;
}
.whale-overlay .ocean-glow {
  position: absolute; right: 7%; top: 15px; width: 45%; height: 180px;
  opacity: .25; mix-blend-mode: screen;
  background: radial-gradient(ellipse, #65b9ee22, transparent 70%);
  animation: glow-breathe 9s ease-in-out infinite alternate;
}
.ocean.paused *, .ocean.paused .ocean-image { animation-play-state: paused !important; }

@keyframes sea-drift {
  from { transform: translate3d(-5px, -3px, 0) rotate(-.5deg) scale(1.01); }
  to   { transform: translate3d(8px, 7px, 0) rotate(.55deg) scale(1.035); }
}
@keyframes light-drift {
  from { transform: rotate(-8deg) translateX(-20px); opacity: .35; }
  to   { transform: rotate(7deg) translateX(20px); opacity: .85; }
}
@keyframes glow-breathe {
  from { opacity: .4; transform: scale(.95); }
  to   { opacity: 1; transform: scale(1.07); }
}

/* ---------- shell ---------- */
.wrap { position: relative; z-index: 1; max-width: 1720px; margin: 0 auto; padding: 0 4.05vw; }
header { position: relative; z-index: 2; background: transparent; }

.bar { display: flex; align-items: center; gap: 36px; min-height: clamp(50px, 3.65vw, 58px); }
.brand { display: flex; align-items: center; gap: 11px; flex-shrink: 0; }
.brand-mark { width: 36px; height: 31px; flex-shrink: 0; }
.brand strong { display: block; font-size: 15px; font-weight: 600; letter-spacing: .1px; }
.brand small { display: block; font-size: 11px; letter-spacing: 1px; line-height: 1.3; color: var(--muted); }
nav { display: flex; gap: 34px; align-self: stretch; }
nav button { position: relative; color: var(--muted); padding: 0 3px; font-size: 14px; }
nav button:hover { color: #fff; }
nav button.on { color: #fff; }
nav button.on::after {
  content: ''; position: absolute; bottom: 4px; left: 15%; right: 15%; height: 1px;
  background: #667e9a; border-radius: 100%;
}
.search {
  margin-left: auto; display: flex; align-items: center; gap: 10px;
  border: 1px solid #35445a; border-radius: 12px; padding: 5px 10px;
  background: #15243988; max-width: 240px; color: var(--muted);
}
.search input { min-width: 0; width: 100%; border: 0; outline: 0; background: none; color: #fff; font-size: 12px; }
.search input::placeholder { color: #98a9bf; }
.github { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.github:hover { color: #fff; }
.github svg { width: 27px; height: 27px; fill: #edf4ff; flex-shrink: 0; }
.mk-github-star { font-variant-numeric: tabular-nums; font-size: 12px; }

/* ---------- intro ---------- */
.intro { padding: 14px 0; }
.intro h1 {
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(32px, 3.5vw, 58px); line-height: 1.25;
  letter-spacing: -1.3px; margin: 0 0 7px;
}
.intro p {
  margin: 0; font-size: clamp(14px, 1.32vw, 21px);
  color: #b0b9c8; font-family: var(--serif); line-height: 1.4;
}

/* ---------- showcase ---------- */
.showcase {
  display: grid; grid-template-columns: 1.7fr 1fr; gap: 12px;
  align-items: stretch; height: clamp(410px, 32.6vw, 540px);
}
.feature, .card {
  background: linear-gradient(120deg, #101d2bc4, #0b1724e6);
  border: 1px solid #2a4059; border-radius: 17px;
  box-shadow: inset 0 1px #ffffff03; overflow: hidden;
  transition: transform .23s, border-color .23s, box-shadow .23s;
}
.feature:hover, .card:hover {
  border-color: #486181; transform: translateY(-2px);
  box-shadow: 0 12px 30px #0002;
}
.main-feature { padding: 18px 18px 14px; display: flex; flex-direction: column; min-width: 0; }
.main-feature > .picture { flex: 1; min-height: 0; border: 1px solid #344b67; border-radius: 13px; }
.feature-bottom {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 10px 7px 0; min-height: 68px;
}
.label { font-size: 11px; letter-spacing: 1px; margin-bottom: 3px; color: #8fbfff; }
.feature-bottom h2 { font-family: var(--serif); font-weight: 500; font-size: 20px; }
.feature-bottom h3 { font-family: var(--serif); font-weight: 500; font-size: 17px; }
h2, h3, p { margin: 0; }
.sub {
  color: var(--muted); font-size: 13px; margin-top: 3px;
  font-family: Georgia, var(--serif);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.primary {
  background: linear-gradient(#4b97ff, #3475e6); color: #fff;
  box-shadow: inset 0 1px #ffffff30, 0 4px 12px #226eff33;
  border-radius: 14px; padding: 9px 20px; font-size: 13px; white-space: nowrap;
}
.primary:hover { filter: brightness(1.06); }
.feature-actions { display: flex; align-items: center; gap: 20px; }
.side { display: grid; gap: 10px; grid-template-rows: 1fr 1fr; min-height: 0; }
.small-feature { padding: 8px; display: flex; flex-direction: column; min-height: 0; }
.small-feature .picture { border-radius: 11px; }
.small-feature .feature-bottom { padding: 8px 5px 0; min-height: 48px; }
.small-feature .sub { font-size: 13px; }

/* ---------- media ---------- */
.picture {
  display: block; position: relative; padding: 0; width: 100%;
  overflow: hidden; border-radius: 12px; background: #101b2a;
}
.picture img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.showcase .picture { position: relative; flex: 1; min-height: 0; }
.showcase .picture img { position: absolute; inset: 0; }
.picture:hover img { transform: scale(1.01); }
.picture::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(120deg, transparent 20%, #cce9ff0a 45%, transparent 65%);
  transition: opacity .3s;
}
.picture:hover::after { opacity: 1; }
.preview-hint {
  position: absolute; right: 13px; bottom: 13px; padding: 6px 12px;
  background: #09121cdd; border-radius: 8px; font-size: 12px;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
.picture:hover .preview-hint, .picture:focus-visible .preview-hint { opacity: 1; }

/* ---------- toolbar / filters ---------- */
.toolbar { display: flex; align-items: center; gap: 14px; margin: 22px 0 13px; }
.toolbar h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; }
.count { color: var(--muted); font-size: 12px; }
.sort {
  margin-left: auto; border: 1px solid var(--line); border-radius: 9px;
  background: #0f1d2ce0; color: #c2d1e5; padding: 5px 10px; font-size: 12px;
}
.saved-filter {
  color: var(--muted); border: 1px solid var(--line); border-radius: 9px;
  padding: 5px 10px; font-size: 12px; background: #0f1d2ce0;
}
.saved-filter:hover { color: var(--text); }
.saved-filter[aria-pressed="true"] { color: #b8d4ff; border-color: #5888bd; }
.filter-row { display: flex; gap: 9px; flex-wrap: wrap; margin: -1px 0 18px; }
.filter-chip {
  border: 1px solid #24384f; background: #0d1929; border-radius: 20px;
  padding: 6px 13px; color: #9eb0c7; font-size: 12px;
}
.filter-chip:hover { color: var(--text); }
.filter-chip.selected { background: #294767; color: #edf6ff; border-color: #527397; }
.filter-chip.sub { border-style: dashed; font-size: 11px; padding: 4px 11px; }

/* ---------- grid ---------- */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.card { border-radius: 13px; padding: 5px; display: flex; flex-direction: column; }
.card .picture { border-radius: 9px; }
.card .picture:not(.mk-card-media-pet) img { aspect-ratio: 2.5; height: auto; }
/* 宠物预览接近竖方形：媒体区给出固定比例，预览图完整居中、不裁掉头脚。 */
.card .mk-card-media-pet { aspect-ratio: 2.5; background: radial-gradient(ellipse, #25415d, #121f31); }
.mk-card-media-pet img {
  position: absolute; inset: 8px; width: auto; height: auto;
  max-width: calc(100% - 16px); max-height: calc(100% - 16px);
  margin: auto; object-fit: contain;
}
.info { padding: 7px 6px 5px; position: relative; }
.info h3 { font-size: 15px; font-weight: 600; padding-right: 57px; }
.info .sub { font-size: 12px; padding-right: 57px; }
.mk-card-name { color: inherit; }
a.mk-card-name:hover { text-decoration: underline; }
.meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 2px; font-size: 11px; min-height: 16px; color: var(--faint);
}
.meta > span { color: var(--faint); font-size: 10px; }
.like {
  display: inline-flex; align-items: center; gap: 5px; color: #b9c8dc;
  font-size: 12px; line-height: 1; padding: 4px 2px; white-space: nowrap; min-height: 30px;
}
.like svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.4; fill: none; }
.like:hover { color: #fff; }
.like.is-liked { color: #95c5ff; }
.like.is-liked svg { fill: #95c5ff33; }
.info .meta .like { position: absolute; right: 4px; top: 3px; }

/* ---------- text cards (plugins / presets) ---------- */
.card-text {
  display: block; text-align: left; padding: 18px 16px; min-height: 148px;
  background: linear-gradient(135deg, #142538, #0b1523); border-radius: 9px;
}
.card-text .code-icon {
  display: grid; place-items: center; width: 44px; height: 44px;
  margin-bottom: 14px; border: 1px solid #335475; border-radius: 12px;
  background: #213d5c; color: #a5d0ff; font: 17px var(--mono);
}
.card-text .category-label {
  display: block; margin-bottom: 6px; color: #a3c3e8;
  font-size: 10px; letter-spacing: 1px;
}
.card-text p {
  color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 6px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

/* ---------- states ---------- */
.empty {
  grid-column: 1 / -1; text-align: center; padding: 65px 20px;
  color: var(--muted); border: 1px dashed var(--line); border-radius: 20px;
}
.empty h3 { font-size: 22px; margin-bottom: 8px; color: var(--text); }
.empty p { font-size: 14px; }
.empty-symbol { font-size: 38px; color: #78a9d9; margin-bottom: 12px; }
.empty button { display: block; margin: 15px auto; color: var(--blue); }
.load-more { display: flex; justify-content: center; padding: 32px 0 5px; color: #788da6; font-size: 12px; }
.load-more .secondary { padding: 11px 25px; color: var(--text); }
.load-more span { margin-left: 8px; }
.secondary {
  padding: 9px 14px; border: 1px solid #3b506b; border-radius: 10px;
  font-size: 13px; color: var(--muted); background: transparent;
}
.secondary:hover { color: var(--text); border-color: #5888bd; }
.secondary.is-saved { color: #b8d4ff; border-color: #5888bd; background: #182b42; }

/* ---------- footer ---------- */
footer {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  flex-wrap: wrap; margin-top: 28px; padding: 20px 0 32px;
  border-top: 1px solid #233248; color: #8b9bad; font-size: 12px;
}
footer a:hover { color: #fff; }
.motion-button { padding: 0; color: #a4b9ce; font-size: 12px; white-space: nowrap; }
.motion-button:hover { color: #fff; }
.motion-button[disabled] { opacity: .6; cursor: default; }
.mk-api-state { color: #d7a85f; }

/* ---------- detail dialog ---------- */
dialog.mk-dialog {
  padding: 0; border: 1px solid #3e536d; border-radius: 22px;
  background: #0d1827; color: var(--text);
  width: min(1100px, 96vw); max-height: 92vh;
  box-shadow: 0 35px 120px #0009;
}
dialog.mk-dialog::backdrop { background: #020712cc; backdrop-filter: blur(12px); }
.mk-dialog-inner { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); min-height: 520px; }
.mk-dialog-media { border-right: 1px solid var(--line); padding: 16px; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.mk-dialog-info { padding: 20px 22px; overflow: auto; }
.mk-dialog-close {
  position: absolute; top: 10px; right: 12px; z-index: 2;
  width: 34px; height: 34px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 999px;
  background: rgba(5, 10, 19, .72); color: var(--muted); font-size: 16px;
}
.mk-dialog-close:hover { color: var(--text); }
.mk-dialog-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.mk-dialog-title { font-size: 18px; font-weight: 700; font-family: var(--serif); }
.mk-dialog-tagline { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.mk-dialog-text { font-size: 13px; color: var(--muted); white-space: pre-wrap; }
.mk-dialog-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.mk-tag { font-size: 11px; color: #9ebde1; background: #1b2b41; border-radius: 5px; padding: 3px 8px; }
.mk-install { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(120, 155, 210, .06); padding: 12px 14px; }
.mk-install-title { font-size: 12px; font-weight: 700; color: var(--blue); margin-bottom: 6px; }
.mk-install-steps { font-size: 12px; color: var(--muted); margin: 0; padding-left: 18px; }
.mk-install-steps li { margin: 4px 0; }
.mk-code {
  display: flex; align-items: center; gap: 8px; margin-top: 8px; overflow-x: auto;
  background: #10203a; border: 1px solid var(--line); border-radius: 9px;
  padding: 7px 10px; font: 12px var(--mono); color: var(--blue);
}
.mk-code button {
  margin-left: auto; flex: none; border: 1px solid var(--line);
  background: rgba(120, 155, 210, .12); color: var(--muted);
  border-radius: 7px; padding: 3px 9px; font-size: 11px;
}
.mk-code button:hover { color: var(--text); }
.mk-skin-modes { display: flex; gap: 6px; margin: 0 0 10px; align-items: center; flex-wrap: wrap; }
.mk-skin-mode {
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
  font-size: 12px; color: var(--muted); background: rgba(120, 155, 210, .08);
}
.mk-skin-mode.on { background: #294767; color: #edf6ff; border-color: #527397; }
.mk-skin-tryon { margin-left: auto; font-size: 11px; color: var(--blue); white-space: nowrap; }
.mk-skin-tryon:hover { text-decoration: underline; }
.mk-skin-img {
  width: 100%; flex: 1; min-height: 0; object-fit: contain; display: block;
  border: 1px solid var(--line); border-radius: 12px; background: rgba(96, 128, 178, .10);
}
.mk-pet-media { display: grid; grid-template-rows: auto auto; gap: 10px; }
.mk-pet-main {
  width: 100%; min-height: 200px; max-height: 44vh; object-fit: contain;
  border: 1px solid var(--line); border-radius: 12px;
  background: radial-gradient(ellipse, #25415d, #121f31);
}
.mk-pet-thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.mk-pet-thumbs img {
  width: 64px; height: 64px; object-fit: cover; border-radius: 8px;
  border: 1px solid var(--line); cursor: pointer; background: rgba(96, 128, 178, .12);
}
.mk-pet-thumbs img.on { border-color: var(--accent); }
.mk-pet-sheet { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: rgba(96, 128, 178, .12); }
.mk-dialog-actions {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line);
}
.mk-dialog-actions .like { position: static; color: var(--muted); }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  z-index: 5; padding: 12px 20px; white-space: nowrap;
  background: #243a53; border: 1px solid #50749a; border-radius: 12px;
  box-shadow: 0 8px 30px #0005; font-size: 14px;
}
.hidden, [hidden] { display: none !important; }

/* ---------- responsive ---------- */
@media (min-width: 1720px) {
  .wrap { padding-left: 64px; padding-right: 64px; }
}
@media (max-width: 1100px) {
  .bar { gap: 24px; }
  nav { gap: 20px; }
  .search { max-width: 210px; }
  .github { display: none; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .showcase { grid-template-columns: 1.55fr 1fr; }
  .feature-bottom h2 { font-size: 18px; }
  .primary { padding: 8px 14px; }
  .toolbar h2 { font-size: 24px; }
}
@media (max-width: 760px) {
  .wrap { padding: 0 20px; }
  .bar { flex-wrap: wrap; gap: 0; min-height: 104px; padding-top: 13px; }
  .brand { flex: 1; }
  .brand strong { font-size: 15px; }
  .brand small { font-size: 10px; }
  .brand-mark { width: 31px; height: 28px; }
  .search { max-width: 190px; width: 47%; padding: 7px 8px; }
  .search input { font-size: 11px; }
  nav { order: 3; width: 100%; height: 44px; justify-content: space-between; gap: 12px; }
  nav button { font-size: 13px; min-width: 40px; }
  nav button.on::after { bottom: 4px; }
  .intro { padding: 18px 0 20px; }
  .intro h1 { font-size: 29px; line-height: 1.45; letter-spacing: -.9px; max-width: 350px; margin-bottom: 9px; }
  .intro h1 span { display: block; }
  .intro p { font-size: 13px; line-height: 1.6; max-width: 320px; }
  .showcase { grid-template-columns: 1fr; gap: 12px; height: auto; }
  .main-feature { padding: 10px; }
  .main-feature > .picture { flex: none; }
  .main-feature > .picture img { position: static; aspect-ratio: 1.85; height: auto; }
  .feature-bottom { padding: 10px 3px 1px; min-height: 62px; }
  .feature-bottom h2 { font-size: 18px; }
  .feature-actions { gap: 8px; }
  .feature-actions > .like { display: none; }
  .primary { padding: 9px 13px; font-size: 12px; }
  .side { grid-template-columns: 1fr 1fr; grid-template-rows: auto; gap: 10px; }
  .small-feature { padding: 6px; border-radius: 13px; }
  .small-feature .picture img { position: static; aspect-ratio: 1.8; height: auto; }
  .small-feature .feature-bottom { padding: 7px 2px 1px; min-height: 44px; }
  .small-feature h3 { font-size: 14px; }
  .small-feature .sub { font-size: 11px; }
  .small-feature .like { font-size: 10px; gap: 3px; }
  .small-feature .like svg { width: 14px; height: 14px; }
  .toolbar { gap: 9px; flex-wrap: wrap; margin: 24px 0 13px; }
  .toolbar h2 { font-size: 22px; }
  .count { font-size: 10px; }
  .sort, .saved-filter { font-size: 11px; padding: 5px 8px; }
  .filter-chip { font-size: 11px; padding: 5px 11px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; }
  .card { border-radius: 14px; }
  .card .picture:not(.mk-card-media-pet) img { aspect-ratio: 1.8; }
  .card .mk-card-media-pet { aspect-ratio: 1.8; }
  .info { padding: 8px 4px 5px; }
  .info h3 { font-size: 14px; }
  .info .sub { font-size: 10px; }
  .info h3, .info .sub { padding-right: 43px; }
  .info .meta .like { font-size: 10px; gap: 3px; right: 0; }
  .meta > span { font-size: 9px; }
  .card-text { padding: 16px 12px; min-height: 200px; }
  .load-more { padding-top: 25px; }
  footer { flex-direction: column; align-items: flex-start; gap: 9px; font-size: 11px; margin-top: 32px; }
  .mk-dialog-inner { grid-template-columns: 1fr; min-height: 0; }
  .mk-dialog-media { border-right: 0; border-bottom: 1px solid var(--line); }
  .mk-skin-img { min-height: 260px; max-height: 52vh; }
  .ocean { height: 100vh; height: 100dvh; }
  #bgCanvas.ready { opacity: .36; }
  .whale-overlay { width: 100%; height: 100%; mask-image: none; -webkit-mask-image: none; }
  .whale-overlay .ocean-image { width: 660px; right: -180px; top: 0; opacity: .65; }
  .whale-overlay .ocean-light { width: 100%; height: 390px; top: -100px; opacity: .5; }
  .whale-overlay .ocean-glow { right: -20%; width: 95%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  #bgCanvas { transition: none; }
}
</style>
</head>
