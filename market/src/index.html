<style>
/* =========================================================================
   创意工坊 · market/src/index.html
   视觉语言沿用市场首版设计（--g-* token），新增：颁奖台、卡片网格、详情弹层。
   ========================================================================= */
:root {
  --g-bg: #050a13;
  --g-bg-soft: rgba(255, 255, 255, .11);
  --g-card: rgba(96, 132, 190, .20);
  --g-card-hover: rgba(124, 158, 214, .30);
  --g-line: rgba(214, 232, 252, .26);
  --g-line-strong: rgba(214, 232, 252, .44);
  --g-text: #f7fafd;
  --g-muted: #c7d3e4;
  --g-faint: #9fb1c9;
  --g-accent: #3a65c2;
  --g-accent-hover: #456fca;
  --g-accent-deep: #9bb2e2;
  --g-accent-soft: rgba(58, 101, 194, .18);
  --g-shadow: 0 16px 46px rgba(4, 14, 32, .26), 0 2px 8px rgba(4, 14, 32, .18);
  --g-radius: 15px;
  --g-gold: #f2c14e;
  --g-silver: #b9c4d4;
  --g-bronze: #cf9364;
  --g-font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text',
    'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --g-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #071327;
  color: var(--g-text);
  font: 14px/1.55 var(--g-font);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
canvas#bgCanvas {
  position: fixed; inset: 0; z-index: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  opacity: 0;
  transition: opacity .5s ease;
}
canvas#bgCanvas.ready { opacity: 1; }
a { color: var(--g-accent-deep); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; border-radius: var(--g-radius); }
button { letter-spacing: 0; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid rgba(58, 101, 194, .94);
  outline-offset: 2px;
}
.wrap {
  position: relative; z-index: 1;
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 22px 60px;
}

/* ---------- header ---------- */
.mk-header {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 10px 0 16px;
}
.mk-brand { display: flex; align-items: center; gap: 12px; }
.mk-brand-logo {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, #2e519b, #456fca);
  display: grid; place-items: center;
  box-shadow: 0 6px 20px rgba(58, 101, 194, .35);
}
.mk-brand-logo svg { width: 26px; height: 19px; }
.mk-brand-title { font-size: 19px; font-weight: 700; line-height: 1.2; }
.mk-brand-sub { font-size: 12px; color: var(--g-faint); }
.mk-tabs { display: flex; gap: 6px; margin-left: 6px; flex-wrap: wrap; }
.mk-tab {
  border: 1px solid var(--g-line); background: var(--g-bg-soft);
  color: var(--g-muted); padding: 7px 16px; cursor: pointer;
  transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.mk-tab:hover { color: var(--g-text); border-color: var(--g-line-strong); }
.mk-tab.on { background: var(--g-accent-soft); color: var(--g-text); border-color: rgba(58, 101, 194, .6); }
.mk-tab .mk-tab-count { color: var(--g-faint); font-size: 12px; margin-left: 5px; }
.mk-search {
  flex: 1 1 220px; min-width: 180px;
  border: 1px solid var(--g-line); background: rgba(120, 155, 210, .18);
  color: var(--g-text); padding: 8px 14px; border-radius: var(--g-radius);
}
.mk-search::placeholder { color: var(--g-faint); }
.mk-header-meta { font-size: 12px; color: var(--g-faint); }
.mk-github {
  display: inline-flex; align-items: center; gap: 7px;
  margin-left: auto; /* 紧贴所在行右端；固定定位时被覆盖 */
  border: 1px solid var(--g-line); background: var(--g-bg-soft);
  color: var(--g-muted); padding: 7px 12px; border-radius: var(--g-radius);
  text-decoration: none; font-size: 13px; line-height: 1;
  transition: color .15s ease, border-color .15s ease, background .15s ease;
}
.mk-github:hover { color: var(--g-text); border-color: var(--g-line-strong); }
.mk-github svg { width: 18px; height: 18px; }
.mk-github-star { font-variant-numeric: tabular-nums; }
/* 宽窗口下钉在视口右上角；窄窗口回到页头行尾。 */
@media (min-width: 1400px) {
  .mk-github { position: fixed; top: 14px; right: 18px; z-index: 30; }
}

/* ---------- podium ---------- */
.mk-podium { margin: 6px 0 26px; }
.mk-podium-group {
  max-width: 980px;
  margin: 0 auto;
  border: 1px solid var(--g-line); border-radius: 16px;
  background: var(--g-card); padding: 18px 18px 22px;
  box-shadow: var(--g-shadow);
}
.mk-podium-title {
  display: flex; align-items: baseline; gap: 9px;
  font-size: 16px; font-weight: 700; margin: 0 0 16px;
}
.mk-podium-title .mk-podium-kind { font-size: 12px; color: var(--g-faint); font-weight: 400; }
.mk-podium-list {
  display: flex; align-items: flex-end; gap: 14px;
  min-height: 268px;
  justify-content: center;
}
/* 经典阶梯：第 1 名居中最高最宽（金色光晕）；第 2 名左移次高（银边）；第 3 名右移更矮（铜边）。 */
.mk-podium-slot {
  flex: 0 1 232px; text-align: center; cursor: pointer;
  border: 1px solid var(--g-line); border-radius: 14px;
  background: var(--g-bg-soft);
  padding: 10px 8px 14px;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.mk-podium-slot:hover { transform: translateY(-6px); border-color: var(--g-line-strong); }
.mk-podium-slot.rank-1 {
  order: 2; flex: 0 1 280px; height: 288px;
  border-color: rgba(242, 193, 78, .55);
  background: linear-gradient(180deg, rgba(242, 193, 78, .10), rgba(96, 128, 178, .18) 45%, rgba(96, 128, 178, .14));
  animation: podiumGlow 3.2s ease-in-out infinite;
}
.mk-podium-slot.rank-2 { order: 1; flex: 0 1 252px; height: 248px; border-color: rgba(203, 213, 225, .45); }
.mk-podium-slot.rank-3 { order: 3; flex: 0 1 232px; height: 218px; border-color: rgba(205, 127, 50, .42); }
.mk-podium-slot.pending { opacity: .62; }

@keyframes podiumGlow {
  0%, 100% { box-shadow: 0 10px 30px rgba(242, 193, 78, .10), inset 0 0 0 1px rgba(242, 193, 78, .16); }
  50%      { box-shadow: 0 16px 46px rgba(242, 193, 78, .28), inset 0 0 0 1px rgba(242, 193, 78, .36); }
}
.mk-podium-slot.rank-1:hover { animation: none; box-shadow: 0 18px 52px rgba(242, 193, 78, .34), inset 0 0 0 1px rgba(242, 193, 78, .44); }

.mk-medal {
  display: inline-grid; place-items: center;
  width: 28px; height: 28px; border-radius: 50%;
  font-size: 13px; font-weight: 700; color: #0b1220;
  margin-bottom: 9px;
}
.mk-podium-slot.rank-1 .mk-medal { background: var(--g-gold); animation: medalPulse 2.4s ease-in-out infinite; }
.mk-podium-slot.rank-2 .mk-medal { background: var(--g-silver); box-shadow: 0 0 12px rgba(203, 213, 225, .35); }
.mk-podium-slot.rank-3 .mk-medal { background: var(--g-bronze); box-shadow: 0 0 10px rgba(205, 127, 50, .30); }

@keyframes medalPulse {
  0%, 100% { box-shadow: 0 0 12px rgba(242, 193, 78, .40); }
  50%      { box-shadow: 0 0 28px rgba(242, 193, 78, .75); }
}
.mk-podium-thumb {
  width: 100%; height: 148px; object-fit: contain; border-radius: 10px;
  background: rgba(96, 128, 178, .20); display: block;
}
/* 预览图按名次递减，保证内容完整贴合卡片（低名次卡片更矮，文字绝不外溢）。 */
.mk-podium-slot.rank-2 .mk-podium-thumb { height: 118px; }
.mk-podium-slot.rank-3 .mk-podium-thumb { height: 98px; }
.mk-podium-name {
  font-size: 14px; font-weight: 600; margin-top: 10px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mk-podium-votes { font-size: 12px; color: var(--g-faint); }
.mk-podium-slot.rank-1 .mk-podium-name { font-size: 15px; }
.mk-podium-slot.rank-1 .mk-podium-votes { font-size: 13px; color: rgba(242, 193, 78, .85); }
.mk-podium-empty {
  flex: 1; align-self: center; text-align: center;
  color: var(--g-faint); font-size: 12px;
}

/* ---------- content ---------- */
.mk-toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin: 0 0 14px;
}
.mk-sort { display: flex; gap: 6px; }
.mk-chip {
  border: 1px solid var(--g-line); background: var(--g-bg-soft);
  color: var(--g-muted); padding: 5px 12px; cursor: pointer;
  font-size: 12px; border-radius: 999px; white-space: nowrap;
}
.mk-chip:hover { color: var(--g-text); }
.mk-chip.on { background: var(--g-accent-soft); color: var(--g-text); border-color: rgba(58, 101, 194, .6); }
/* 二级分类行：略小一号、虚线描边，与一级筛选在视觉上区分层级。 */
.mk-chip-sub { font-size: 11px; padding: 4px 10px; border-style: dashed; color: var(--g-faint); }
.mk-chip-sub:hover { color: var(--g-text); }
.mk-chip-sub.on { border-style: dashed; color: var(--g-text); }
.mk-toolbar-info { margin-left: auto; font-size: 12px; color: var(--g-faint); }
.mk-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
  gap: 16px;
}
.mk-card {
  border: 1px solid var(--g-line); border-radius: var(--g-radius);
  background: var(--g-card);
  overflow: hidden;
  box-shadow: var(--g-shadow);
  transition: transform .16s ease, border-color .16s ease, background .16s ease;
  display: flex; flex-direction: column;
}
.mk-card:hover { transform: translateY(-3px); background: var(--g-card-hover); border-color: var(--g-line-strong); }
.mk-card-media {
  position: relative; height: 148px; background: rgba(96, 128, 178, .16); overflow: hidden;
}
/* 皮肤预览图为 1440x900（16:10），媒体区同比例时 cover 零裁切、完整展示 */
.mk-card-media-skin { height: auto; aspect-ratio: 16 / 10; }
.mk-card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* 宠物帧接近竖方形；完整居中展示，不能为填满横向媒体区而裁掉头脚。 */
.mk-card-media-pet { display: grid; place-items: center; padding: 8px; }
.mk-card-media-pet img {
  position: absolute; inset: 8px; width: auto; height: auto;
  max-width: calc(100% - 16px); max-height: calc(100% - 16px);
  margin: auto; object-fit: contain;
}
.mk-card-media .mk-accent-bar { position: absolute; left: 0; right: 0; top: 0; height: 4px; }
.mk-card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.mk-card-name { font-size: 14px; font-weight: 700; line-height: 1.3; }
.mk-card-name .mk-card-name-en { color: var(--g-faint); font-weight: 400; font-size: 12px; margin-left: 6px; }
a.mk-card-name { color: inherit; text-decoration: none; }
a.mk-card-name:hover { text-decoration: underline; }
.mk-card-meta { font-size: 12px; color: var(--g-faint); }
.mk-card-metric { font-size: 11px; color: var(--g-muted); font-variant-numeric: tabular-nums; }
    .mk-card-desc {
  font-size: 12px; color: var(--g-muted); flex: 1;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.mk-card-actions {
  display: flex; align-items: center; gap: 8px; margin-top: 4px;
}
.mk-like {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--g-line); background: var(--g-bg-soft);
  color: var(--g-muted); padding: 5px 12px; cursor: pointer;
  font-size: 12px;
}
.mk-like:hover { border-color: var(--g-line-strong); color: var(--g-text); }
.mk-like.on {
  background: var(--g-accent-soft); color: var(--g-accent-deep);
  border-color: rgba(58, 101, 194, .6);
}
.mk-like .mk-like-ico { font-size: 13px; line-height: 1; }
.mk-detail {
  margin-left: auto;
  border: 1px solid var(--g-line); background: transparent;
  color: var(--g-accent-deep); padding: 5px 12px; cursor: pointer; font-size: 12px;
}
.mk-detail:hover { border-color: var(--g-line-strong); }
.mk-empty {
  border: 1px dashed var(--g-line-strong); border-radius: var(--g-radius);
  padding: 42px 16px; text-align: center; color: var(--g-faint);
}

/* ---------- detail modal ---------- */
dialog.mk-dialog {
  border: 1px solid var(--g-line-strong); border-radius: 18px;
  background: rgba(30, 47, 76, .96); color: var(--g-text);
  width: min(1100px, 96vw); max-height: 92vh;
  padding: 0; box-shadow: 0 26px 80px rgba(2, 8, 20, .5);
  backdrop-filter: blur(10px);
}
dialog.mk-dialog::backdrop { background: rgba(5, 12, 26, .66); backdrop-filter: blur(4px); }
.mk-dialog-inner { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0; min-height: 540px; }
.mk-dialog-media { border-right: 1px solid var(--g-line); padding: 16px; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
.mk-dialog-info { padding: 20px 22px; overflow: auto; }
.mk-dialog-close {
  position: absolute; top: 10px; right: 12px; z-index: 2;
  border: 1px solid var(--g-line); background: rgba(5, 10, 19, .6);
  color: var(--g-muted); width: 30px; height: 30px; border-radius: 999px;
  cursor: pointer; display: grid; place-items: center; font-size: 14px;
}
.mk-dialog-close:hover { color: var(--g-text); }
.mk-dialog-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.mk-dialog-title { font-size: 17px; font-weight: 700; }
.mk-dialog-tagline { color: var(--g-faint); font-size: 12px; margin-bottom: 12px; }
.mk-dialog-text { font-size: 13px; color: var(--g-muted); white-space: pre-wrap; }
.mk-dialog-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.mk-tag {
  font-size: 11px; color: var(--g-muted);
  border: 1px solid var(--g-line); border-radius: 999px; padding: 2px 10px;
  background: var(--g-bg-soft);
}
.mk-install {
  margin-top: 14px; border: 1px solid var(--g-line); border-radius: 12px;
  background: var(--g-bg-soft); padding: 12px 14px;
}
.mk-install-title { font-size: 12px; font-weight: 700; color: var(--g-accent-deep); margin-bottom: 6px; }
.mk-install-steps { font-size: 12px; color: var(--g-muted); margin: 0; padding-left: 18px; }
.mk-install-steps li { margin: 4px 0; }
.mk-code {
  display: flex; align-items: center; gap: 8px;
  background: #10203a; border: 1px solid var(--g-line);
  border-radius: 9px; padding: 7px 10px;
  font: 12px var(--g-mono); color: var(--g-accent-deep);
  margin-top: 8px; overflow-x: auto;
}
.mk-code button {
  margin-left: auto; flex: none;
  border: 1px solid var(--g-line); background: var(--g-bg-soft);
  color: var(--g-muted); border-radius: 7px; padding: 3px 9px; font-size: 11px; cursor: pointer;
}
.mk-code button:hover { color: var(--g-text); }
.mk-skin-modes { display: flex; gap: 6px; margin: 0 0 10px; align-items: center; flex-wrap: wrap; }
.mk-skin-tryon { margin-left: auto; font-size: 11px; color: var(--g-accent-deep); white-space: nowrap; }
.mk-skin-tryon:hover { text-decoration: underline; }
.mk-skin-img {
  width: 100%; flex: 1; min-height: 0; object-fit: contain;
  border: 1px solid var(--g-line); border-radius: 12px;
  background: rgba(96, 128, 178, .16); display: block;
}
.mk-pet-media { display: grid; grid-template-rows: auto auto; gap: 10px; }
.mk-pet-main { width: 100%; border-radius: 12px; background: rgba(96, 128, 178, .16); border: 1px solid var(--g-line); }
.mk-pet-thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.mk-pet-thumbs img {
  width: 64px; height: 64px; object-fit: cover; border-radius: 8px;
  border: 1px solid var(--g-line); cursor: pointer; background: rgba(96, 128, 178, .16);
}
.mk-pet-thumbs img.on { border-color: var(--g-accent); }
.mk-pet-sheet { width: 100%; border-radius: 10px; border: 1px solid var(--g-line); background: rgba(96, 128, 178, .16); }
.mk-tracks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* ---------- footer / toast ---------- */
.mk-footer {
  margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--g-line);
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  font-size: 12px; color: var(--g-faint);
}
.mk-toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(16px);
  background: rgba(38, 58, 92, .95); border: 1px solid var(--g-line-strong);
  color: var(--g-text); border-radius: 10px; padding: 9px 16px;
  font-size: 13px; opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease; z-index: 50;
}
.mk-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 900px) {
  .mk-podium { margin: 6px 0 22px; }
  .mk-podium-group { max-width: 100%; padding: 14px 12px 16px; border-radius: 14px; }
  .mk-podium-title { font-size: 14px; margin-bottom: 12px; }
  .mk-podium-list { gap: 8px; min-height: 202px; }
  .mk-podium-slot { flex: 0 1 150px; padding: 8px 6px 12px; border-radius: 12px; }
  .mk-podium-slot.rank-1 { flex: 0 1 172px; height: 212px; }
  .mk-podium-slot.rank-2 { flex: 0 1 160px; height: 190px; }
  .mk-podium-slot.rank-3 { flex: 0 1 150px; height: 178px; }
  .mk-medal { width: 24px; height: 24px; font-size: 12px; }
  .mk-podium-thumb { height: 116px; }
  .mk-podium-slot.rank-2 .mk-podium-thumb { height: 96px; }
  .mk-podium-slot.rank-3 .mk-podium-thumb { height: 84px; }
  .mk-podium-name { font-size: 12px; margin-top: 8px; }
  .mk-podium-votes { font-size: 11px; }
  .mk-dialog-inner { grid-template-columns: 1fr; }
  .mk-dialog-media { border-right: 0; border-bottom: 1px solid var(--g-line); }
  .mk-skin-img { min-height: 300px; max-height: 52vh; }
  .wrap { padding: 14px 14px 50px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
