# dsh-beyond-workscope bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:~/code/dsh-web-ui/packages/dsh-beyond-workscope`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (perception, grant registry, agent tools, /api routes),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI
# (grant confirmation card + active-grant management).
- insert:
    - id: beyond-workscope
      name: '@linxin666/dsh-beyond-workscope'
