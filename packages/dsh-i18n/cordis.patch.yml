# bundle patch for the dsh-i18n language pack plugin: inserts its plugin row
# into the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-i18n`. The single row
# mounts BOTH halves: the host half is a no-op (pure browser plugin) and the
# browser half registers the ru language + dictionaries.
- insert:
    - id: i18n
      name: '@linxin666/dsh-i18n'
