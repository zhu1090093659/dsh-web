# dsh-mermaid bundle patch: inserts the mermaid diagram plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-mermaid`.
#
# One package, both halves: the node half (exports ".") registers the
# "mermaid" settings section; the browser half (declared by `dsh.client`,
# served from lib/client.js) renders mermaid fences in assistant messages as
# SVG figures and seats the plugin's settings card in the Web UI plugins group.
- insert:
    - id: ui-mermaid
      name: '@linxin666/dsh-client-ui-mermaid'
