# ============================================================================
# miku-pet 的 bundle patch —— 把宠物插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   这是 miku-pet 的"挂载声明"。DSH 启动时按 bundle 层栈把各个插件的
#   patch 叠起来组成配置树。本文件就是 miku-pet 这一层的内容。
#
# 【工作原理】
#   - insert：往配置树里添加新的插件行（entry）
#   - 每个 entry 有 id（行标识，patch 覆盖时按它定位）和 name（插件模块）
#   - name: 'miku-pet' 会解析包入口 lib/index.js（宿主半侧）
#   - 因为 package.json 声明了 dsh.client，DSH 的模块系统同时会把这个包
#     扫描为"浏览器插件"，向页面提供客户端 bundle
#   - 注意：entry id 与宿主路由都用 miku-pet（不用 pet），避免与本机已装
#     的 dsh-web-ui 内置 dsh-pet（web-ui-pet / /pet/* 路由）冲突
#
# ============================================================================

- insert:
    - id: miku-pet                 # 插件行 id（唯一）
      name: 'miku-pet'             # 模块名：解析到 lib/index.js