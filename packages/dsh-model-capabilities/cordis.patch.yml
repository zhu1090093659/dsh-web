# bundle patch for the dsh-model-capabilities plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-model-capabilities`.
#
# The row is a bare plugin by package name: the node half (exports ".") only
# registers the plugin's settings namespace `dsh-model-capabilities`, which
# archives disabled provider profiles, and the `dsh.client` declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/ui-model-capabilities/client.js) load in the web GUI.
- insert:
    - id: ui-model-capabilities
      name: '@linxin666/dsh-client-ui-model-capabilities'
