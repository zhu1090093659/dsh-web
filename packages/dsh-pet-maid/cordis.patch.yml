# dsh-pet-maid bundle patch: inserts its plugin row into the web plugin roster.
# The bundle is the official dsh plugin shape — install it into a dsh profile
# (`dsh plugin --profile <name> add link:<dsh-web-ui>/packages/dsh-pet-maid`). The single
# row mounts BOTH halves: the host side (pet state machine with concurrent-
# session working tiers, affinity score, pet-maid.* RPC service) and the
# browser side (the modules node half scans dsh.client packages into the web
# plugin roster, served from this package's lib/client.js). The atlas is
# resolved at runtime: the local Codex Pet maid theme when installed, else the
# bundled fallback whale assets under assets/whale (see asset-source.ts).
- insert:
    - id: pet-maid
      name: '@linxin666/dsh-pet-maid'
