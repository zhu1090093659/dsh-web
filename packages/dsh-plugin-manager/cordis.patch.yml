# dsh-plugin-manager bundle patch: inserts the dual-face plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-plugin-manager`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (the /api/dsh-plugin-manager route family over the
# Cordis Loader), and the `dsh.client` declaration in package.json makes the
# browser half (exports "./client") load in the web GUI, registering the
# "Manage" tab inside the Plugins settings section.
- insert:
    - id: plugin-manager
      name: '@linxin666/dsh-plugin-manager'
