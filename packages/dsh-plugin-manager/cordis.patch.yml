# bundle patch for the dsh-plugin-manager plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-plugin-manager`.
- insert:
    - id: ui-plugin-manager
      name: '@linxin666/dsh-client-ui-plugin-manager'
