# preset-center bundle patch: inserts its dshClient row into the web plugin roster.
# The host half owns the preset library (install/enable/disable) and the
# loopback-only /api/preset-center/* routes; the browser half contributes the
# Presets panel into the Workshop card's declared child slot.
- insert:
    - id: ui-preset-center
      name: '@linxin666/dsh-client-ui-preset-center'
