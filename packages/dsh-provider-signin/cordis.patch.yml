# dsh-provider-signin bundle patch: inserts its plugin row into the web plugin
# roster. The single row mounts BOTH halves: the host side (authorization
# attempt relay routes under /api/provider-signin) and the browser side (the
# provider-card seats in the Models settings section, served from this
# package's lib/client.js).
- insert:
    - id: provider-signin
      name: '@linxin666/dsh-provider-signin'
