# One package: the dual-face remote-control plugin. Install it into a dsh
# profile (`dsh plugin --profile <name> add link:...`) — the patch layer below
# inserts the single plugin row that mounts BOTH halves: the host side
# (pairing tokens, device sessions, /api/pair routes, the api/gate listener)
# and the browser side (the modules node half scans `dsh.client` packages into
# the web plugin roster, served from this package's lib/client.js).

- insert:
    - id: remote-web-ui
      name: '@linxin666/dsh-remote-web-ui'
