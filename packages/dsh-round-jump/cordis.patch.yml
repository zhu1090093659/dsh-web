# dsh-round-jump bundle patch: the right-edge hover popup that jumps to any
# past user round. The single row mounts both halves — the node half (a
# no-op placeholder so the package resolves as a profile bundle) and the
# browser half (the modules node half scans dsh.client packages into the web
# plugin roster, served from this package's lib/client.js).
- insert:
    - id: round-jump
      name: '@linxin666/dsh-round-jump'
