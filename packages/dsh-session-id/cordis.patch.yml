# bundle patch for the session-id plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-session-id`.
- insert:
    - id: ui-session-id
      name: '@linxin666/dsh-client-ui-session-id'
