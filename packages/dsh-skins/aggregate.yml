# 聚合包清单：patchFrom 的包其 cordis.patch.yml insert 行会被汇总进本包 patch
# deps 的包进 package.json dependencies（workspace:*）
# 皮肤不再独立成包：资产内置在 dsh-skins/skins/<id>（build.mjs 从 packages/skins/<id>
# 复制 skin.json + lib/client.js），皮肤中心 npm 布局直接扫描该目录；
# 因此这里只保留 skin-center（patch 行 ui-skin-center 的宿主）。
patchFrom:
  - ../skins/skin-center
deps:
  - ../skins/skin-center
