# 聚合包清单：patchFrom 的包其 cordis.patch.yml insert 行会被汇总进本包 patch
# deps 的包进 package.json dependencies（workspace:*）：children 作为 dependencies
# 安装，DSH loader 从 profile 顶层解析 patch 行；严格（isolated）布局需在
# profile 配 hoist（nodeLinker: hoisted 或 public-hoist-pattern，见根 README）
# 皮肤不再独立成包：资产内置在 dsh-skins/skins/<id>（build.mjs 从 packages/skins/<id>
# 复制 skin.json + lib/client.js），皮肤中心 npm 布局直接扫描该目录；
# 因此这里只保留 skin-center（patch 行 web-ui-skin-center 的宿主）。
# 聚合行 id 统一加 web-ui- 命名空间：与独立包安装共存，避免 loader duplicate entry id。
patchFrom:
  - ../skins/skin-center
deps:
  - ../skins/skin-center
