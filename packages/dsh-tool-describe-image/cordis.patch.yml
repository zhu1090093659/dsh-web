# dsh-tool-describe-image bundle patch: inserts the describe_image tool plugin
# row into the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/dsh-tool-describe-image`.
#
# The row is a bare host plugin by package name: the node half (exports ".")
# runs in the host process and registers the model-facing describe_image tool
# plus its settings section. There is no browser half; the "Image
# understanding" settings card is rendered by the web GUI's built-in plugin
# config page from the `describe-image` settings section.
- insert:
    - id: describe-image
      name: '@linxin666/dsh-tool-describe-image'
