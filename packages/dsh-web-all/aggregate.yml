# 聚合包清单：patchFrom 的包其 cordis.patch.yml insert 行会被汇总进本包 patch
# deps 的包进 package.json dependencies（workspace:*）：children 作为 dependencies
# 安装，DSH loader 从 profile 顶层解析 patch 行；严格（isolated）布局需在
# profile 配 hoist（nodeLinker: hoisted 或 public-hoist-pattern，见根 README）
# dsh-skins 的 patch 行只有 skin-center，汇总后展开为 web-ui-skin-center
# 所有子插件行 id 统一加 web-ui- 命名空间（生成器剥掉子包 ui- 前缀后加 web-ui-），
# 与独立包安装共存，不再触发 loader duplicate entry id
# self: 聚合包自身也作为插件加载（compat shim 的 host/client 已并入本包，
# 不再需要独立的 dsh-web-compat npm 包 —— npm 对新包名收费）
# 顺序注意：ui-web-ui-settings 排在最前（self 之后），先声明
# web-ui.plugin.item 子槽位，其余插件的设置卡再注入（slots.inject 声明感知，
# 但更早的声明让设置组在任何卡片之前就位，避免观感上的注册顺序歧义）。
# remote-web-ui 排在 pet 前，确保非 loopback 页面先安装配对门控的远程通道，
# 再由 pet 发起首次 /api/pet/* 请求，避免启动阶段命中 SDK 围栏。
patchFrom:
  - ../dsh-web-settings
  - ../dsh-plugin-manager
  - ../dsh-community-plugins
  - ../dsh-market
  - ../dsh-aionui-panel
  - ../dsh-task-board
  - ../dsh-git-graph
  - ../dsh-remote-web-ui
  - ../dsh-pet
  - ../dsh-ssh
  - ../dsh-tool-describe-image
  - ../dsh-chat-recovery
  - ../dsh-liangshen
  - ../dsh-skill-explorer
  - ../dsh-desktop-launcher
  - ../dsh-doctor
  - ../skins/skin-center
self:
  - web-ui-compat
deps:
  - ../dsh-plugin-manager
  - ../dsh-community-plugins
  - ../dsh-market
  - ../dsh-aionui-panel
  - ../dsh-task-board
  - ../dsh-git-graph
  - ../dsh-pet
  - ../dsh-remote-web-ui
  - ../dsh-ssh
  - ../dsh-tool-describe-image
  - ../dsh-chat-recovery
  - ../dsh-liangshen
  - ../dsh-skill-explorer
  - ../dsh-desktop-launcher
  - ../dsh-doctor
  - ../dsh-web-settings
  - ../skins/skin-center
# 外部 npm 插件：dsh-better-sidebar 接管右侧面板位置。行名从 profile 顶层
# 解析（hoisted 布局下由 web-ui-all 的 dependencies 提升），dependencies 里
# 需有 "dsh-better-sidebar"（见 package.json，生成器保留非 workspace 依赖）。
# 行排在 patchFrom 之后：web-ui-settings 行在前，家族设置组先于 better-sidebar
# 应用。aionui 面板默认关闭由 aionui 自身的设置卡决定（「使用 aionui-panel
# （即将弃用）/ 使用 DSH-better-sidebar」，默认后者），无需行级 config patch。
rows:
  - {"id": "better-sidebar", "name": "dsh-better-sidebar"}
  # 外部 npm 插件：dsh-archive-manager（社区版「归档管理」）在设置页提供
  # Codex 风格会话归档管理（按项目分组、搜索筛选、预览、恢复、物理删除）。
  # 依赖引用 @mlgbnb/dsh-archive-manager@1.0.7（见 package.json，生成器保留
  # 非 workspace 依赖），行排在 better-sidebar 之后统一应用。
  - {"id": "archive-manager", "name": "@mlgbnb/dsh-archive-manager"}
