# 聚合包清单：patchFrom 的包其 cordis.patch.yml insert 行会被汇总进本包 patch
# deps 的包进 package.json dependencies（workspace:*）：children 作为 dependencies
# 安装，DSH loader 从 profile 顶层解析 patch 行；严格（isolated）布局需在
# profile 配 hoist（nodeLinker: hoisted 或 public-hoist-pattern，见根 README）
# dsh-skins 的 patch 行只有 skin-center，汇总后展开为 web-ui-skin-center
# 所有子插件行 id 统一加 web-ui- 命名空间（生成器剥掉子包 ui- 前缀后加 web-ui-），
# 与独立包安装共存，不再触发 loader duplicate entry id
# self: 聚合包自身也作为插件加载（compat shim 的 host/client 已并入本包，
# 不再需要独立的 dsh-web-compat npm 包 —— npm 对新包名收费）
# 顺序注意：ui-web-ui-settings 排在最前（self 之后），先声明
# web-ui.plugin.item 子槽位，其余插件的设置卡再注入（slots.inject 声明感知，
# 但更早的声明让设置组在任何卡片之前就位，避免观感上的注册顺序歧义）。
# remote-web-ui 排在 pet 前，确保非 loopback 页面先安装配对门控的远程通道，
# 再由 pet 发起首次 /api/pet/* 请求，避免启动阶段命中 SDK 围栏。
patchFrom:
  - ../dsh-web-settings
  - ../dsh-plugin-manager
  - ../dsh-community-plugins
  - ../dsh-market
  - ../dsh-task-board
  - ../dsh-git-graph
  - ../dsh-remote-web-ui
  - ../dsh-pet
  - ../dsh-ssh
  - ../dsh-tool-describe-image
  - ../dsh-liangshen
  - ../dsh-skill-explorer
  - ../dsh-doctor
  - ../dsh-usage
  - ../dsh-session-archive
  - ../dsh-model-capabilities
  # preset-center 排在 dsh-market 之后：创意工坊卡片先声明 dsh-workshop.panel
  # 子槽位，预设面板再注册进该槽位（见 packages/dsh-preset-center）。
  - ../dsh-preset-center
  - ../skins/skin-center
  # dsh-i18n 语言包无宿主行为、无时序依赖，放列表末尾：注册 ru 语言与全部
  # 家族插件命名空间的 ru 字典（见 packages/dsh-i18n）。
  - ../dsh-i18n
self:
  - web-ui-compat
deps:
  - ../dsh-plugin-manager
  - ../dsh-community-plugins
  - ../dsh-market
  - ../dsh-task-board
  - ../dsh-git-graph
  - ../dsh-pet
  - ../dsh-remote-web-ui
  - ../dsh-ssh
  - ../dsh-tool-describe-image
  - ../dsh-liangshen
  - ../dsh-skill-explorer
  - ../dsh-doctor
  - ../dsh-usage
  - ../dsh-session-archive
  - ../dsh-model-capabilities
  - ../dsh-preset-center
  - ../dsh-web-settings
  - ../skins/skin-center
  - ../dsh-i18n
# 外部 npm 插件段：alpha 分支（2026-09-17 决策）不内置 dsh-better-sidebar。
# 该插件 0.19.1 的全部 @deepseek-ai/dsh-* peer 声明为 ^0.1.5-rc.1，按 semver
# 不覆盖本分支的 0.1.7-alpha.1 cohort（预发布版本只匹配同 [major,minor,patch]
# 元的区间），因此 alpha 实验环境不再挂载这个右侧面板插件：聚合包不依赖它、
# profile 里也不出现它的行。需要右侧面板时按需安装
# （dsh plugin --profile <name> add dsh-better-sidebar@latest）。
# dev 分支保持内置 0.19.1，alpha 每次从 dev rebase 后需重新移除本段。
# 历史沿革（dev 侧仍适用）：2026-08-30 曾因 alpha.2 移除
# `@deepseek-ai/dsh-client-runtime` 面把本行与 dsh-archive-manager 一并排除；
# 2026-08-31 以 0.18.0-alpha.0 回归（inject 改用 dsh-client-modules）；
# 2026-09-04 随 rc.1 cohort 升至 0.18.0 正式版；2026-09-10 升至 0.19.0
# （inject 含 optional 的 dsh-client-ui-sidebar-right 面）；2026-09-11 升至
# 0.19.1。
# @mlgbnb/dsh-archive-manager 仍然排除：其 latest 1.0.7 仍 import 已移除面。
# 出厂默认关闭的可选行（2026-09-09 产品决策）：工具/探索类家族插件对新装用户
# 不加载（设置入口也不出现），在 设置 → 插件 → 插件管理 的聚合子行里逐个开启；
# 开启即写入用户层 disabled:false 覆盖（优先于本默认），停用回写 disabled:true。
# 锁定的核心行（compat/settings/plugin-manager）不可列入本清单。
inactive:
  - web-ui-ssh
  - web-ui-describe-image
  - web-ui-liangshen
  - web-ui-skill-explorer
  - web-ui-doctor
# 被本聚合取代的官方行（2026-09-15 原生优先决策）：官方 web-app 常量挂载
# ui-settings-unarchive-sessions（settings.section id archived-sessions、order 25），
# dsh-session-archive 现在用同一个 section id 接管该入口，把「原生恢复列表 +
# 家族批量归档/删除/自动策略」放在同一页。这里关闭官方行，设置界面只保留一条
# 「已归档会话」一级入口，不再出现两个近似入口。用户层 disabled:false 覆盖仍然优先。
retire:
  - ui-settings-unarchive-sessions
# 兼容退役子插件导出：避免老用户 profile 残留旧条目时 Node.js 抛出 ERR_PACKAGE_PATH_NOT_EXPORTED
tombstones:
  - desktop-launcher
  - dsh-perf