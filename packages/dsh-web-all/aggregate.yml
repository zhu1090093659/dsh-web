# 聚合包清单：patchFrom 的包其 cordis.patch.yml insert 行会被汇总进本包 patch
# deps 的包进 package.json dependencies（workspace:*）：children 作为 dependencies
# 安装，DSH loader 从 profile 顶层解析 patch 行；严格（isolated）布局需在
# profile 配 hoist（nodeLinker: hoisted 或 public-hoist-pattern，见根 README）
# dsh-skins 的 patch 行只有 skin-center，汇总后展开为 web-ui-skin-center
# 所有子插件行 id 统一加 web-ui- 命名空间（生成器剥掉子包 ui- 前缀后加 web-ui-），
# 与独立包安装共存，不再触发 loader duplicate entry id
# self: 聚合包自身也作为插件加载（compat shim 的 host/client 已并入本包，
# 不再需要独立的 dsh-web-compat npm 包 —— npm 对新包名收费）
# 顺序注意：ui-web-ui-settings 排在最前（self 之后），先声明
# web-ui.plugin.item 子槽位，其余插件的设置卡再注入（slots.inject 声明感知，
# 但更早的声明让设置组在任何卡片之前就位，避免观感上的注册顺序歧义）。
# remote-web-ui 已从本聚合退役（包目录保留、仍可独立安装），此前「远程通道排在
# pet 之前，非 loopback 页面先装好配对门控」的顺序约束随之失效。
patchFrom:
  - ../dsh-web-settings
  - ../dsh-plugin-manager
  - ../dsh-market
  - ../dsh-task-board
  # dsh-task-board-github 必须紧跟看板之后：它是看板的外部提供方扩展
  # （GitHub Issues 同步），聚合展开的行序就是浏览器半区与宿主半区的装载
  # 顺序，扩展向看板的提供方席位登记之前看板必须先就位。
  - ../dsh-task-board-github
  # dsh-task-board-team 是看板的第二个外部提供方（团队协作 / team-hub），同样
  # 必须排在 `../dsh-task-board` 之后：它向看板的提供方席位与能力面登记，装载顺序
  # 反了只是多等一次服务，但两份清单保持「提供方紧跟看板」的同一读法。
  - ../dsh-task-board-team
  # dsh-agents 紧跟在看板这一对之后：它也是「定义 + 真实会话执行」的家族面，用户在同
  # 一处找它们。这只是阅读上的归类，没有装载顺序依赖——它只用官方服务（宿主半区
  # systemPrompt / typertGateway / webServer，浏览器半区 locale / renderer / sidebar /
  # slots），自己的侧栏行与主区页面经 slots.inject 声明（行 order 30），不占任何家族
  # 行的席位，因此前后挪动不会改变谁先就位。
  - ../dsh-agents
  - ../dsh-git-graph
  # dsh-update 的自更新行占侧栏 footer action 席位；此前它与 remote-web-ui 共用该席位
  # 并排在其后，remote-web-ui 退役后这个位置上只剩自更新行。
  - ../dsh-update
  # dsh-remote-bridge 排在 dsh-update 之后：它是家族仅剩的远程面（原生手机端的协议
  # v1 通道），但 inject 只要官方的 typertGateway / webServer
  # （浏览器半区 inject 官方的 locale / renderer / sidebar），不依赖任何家族行的席位
  # 或服务，位置只承担阅读归类，紧跟自更新行即可。
  # 行 id 派生为 web-ui-remote-bridge、行 name 就是真实包名
  # （#1901 之后家族行直挂真实包），与官方行名册和独立安装行 id（remote-bridge）
  # 都不相交，因此不需要 familyIds 覆盖。
  - ../dsh-remote-bridge
  # dsh-task-board-remote 紧跟远程桥：它的宿主半区把看板的 board.v1 能力面绑到桥的
  # remoteBridge 扩展缝上，还要拿到看板插件（dsh-task-board）的 taskBoard 服务。
  # 两条接缝先就位更稳——行自身会等这两个服务，先挂载只是少一次等待，不是硬依赖，
  # 所以不往前挪。
  # 行 id 派生为 web-ui-task-board-remote、行 name 就是真实包名（#1901 之后家族行直挂
  # 真实包），与官方行名册和独立安装行 id（task-board-remote）都不相交，因此不需要
  # familyIds 覆盖。
  - ../dsh-task-board-remote
  - ../dsh-ssh
  - ../dsh-liangshen
  - ../dsh-skill-explorer
  - ../dsh-usage
  - ../dsh-session-archive
  - ../dsh-message-edit
  # dsh-win-bash 是 host-only 包（无 src/client/），排在 dsh-liangshen 之后：
  # 它的 win_bash 可用性跟随梁神预设的声明状态，门控在挂载后异步求值。
  - ../dsh-win-bash
  # dsh-i18n 语言包无宿主行为、无时序依赖，放列表末尾：注册 ru 语言与全部
  # 家族插件命名空间的 ru 字典（见 packages/dsh-i18n）。
  - ../dsh-i18n
  # dsh-browser-view 排在最末：它自己不提供任何家族席位，只往 shell.overlay 与
  # 会话头动作列表追加两个可叠加条目，因此与任何已加载插件的顺序都无依赖。
  - ../dsh-browser-view
self:
  - web-ui-compat
deps:
  - ../dsh-plugin-manager
  - ../dsh-market
  - ../dsh-task-board
  # 排在 ../dsh-task-board 之后：扩展依赖看板的提供方契约，deps 顺序与
  # patchFrom 顺序保持一致便于对照。
  - ../dsh-task-board-github
  # 与 patchFrom 同序：看板的第二个提供方（团队协作）紧跟 github 提供方。
  - ../dsh-task-board-team
  # 与 patchFrom 同序：dsh-agents 的行紧跟看板这一对之后（理由见上）。
  - ../dsh-agents
  - ../dsh-git-graph
  - ../dsh-update
  # 与 patchFrom 同序：桥的行紧跟在自更新行之后，两份清单可逐行对照。
  - ../dsh-remote-bridge
  # 与 patchFrom 同序：看板的远程能力面行紧跟在桥之后（它绑桥的扩展缝）。
  - ../dsh-task-board-remote
  - ../dsh-ssh
  - ../dsh-liangshen
  - ../dsh-skill-explorer
  - ../dsh-usage
  - ../dsh-session-archive
  - ../dsh-message-edit
  - ../dsh-win-bash
  - ../dsh-web-settings
  - ../dsh-i18n
  - ../dsh-browser-view

# 独立仓库卫星（npm 外部行）：皮肤中心、宠物、社区插件索引迁出本单一仓库后由各自
# 仓库独立发版，这里只按 registry 版本内置。行 id 与 patchFrom 时期逐字一致
# （web-ui-* 命名空间不变），老 profile 无需迁移；patchFrom 行整体先于外部行渲染。
# 依赖版本由 packages/dsh-web-all/package.json 手写并随生成器保留。
# 代价：外部行不带聚合包的 fault-isolation shell，且客户端不再内联进本包 lib
# （改由卫星自带的 loader entry 挂载）。
# preset-center 排在 patchFrom 行之后：创意工坊卡片（本仓 dsh-market 行）先声明
# dsh-workshop.panel 子槽位，预设面板再注册进该槽位（见 dsh-presets 仓）。
# 家族行 id 覆盖（#1794）：子包独立安装行 id 与聚合家族行 id 解耦。
# dsh-plugin-manager 的独立行必须避开官方 @deepseek-ai/dsh-web-app 的
# ui-plugin-manager（loader 同 id 后来者胜且不报错，官方插件页行被静默丢弃，
# 侧栏「插件」入口随之消失）；派生规则会把新的独立行 id 一并改名，从而移动
# 已发布的聚合行 id 与家族子路径导出。覆盖把两者拆开：独立行改名，聚合行
# web-ui-plugin-manager 与子路径 plugin-manager 逐字不变，老 profile 无需迁移。
# 值必须在本聚合的 web-ui-* id 空间内，且必须指向本聚合真实挂载的行。
# dsh-win-bash：子包的行 id 带包前缀（dsh-win-bash，自身 AGENTS.md 钉死），
# 直接派生会得到 web-ui-dsh-win-bash 与子路径 dsh-win-bash，而家族子路径统一
# 是不带 dsh- 前缀的短名（ssh / usage / liangshen）。覆盖后聚合行与子路径取
# 短名 win-bash，且从第一版就锁定，省掉日后迁移。
familyIds:
  # dsh-agents：子包的行 id 带包前缀（dsh-agents，子包自己的 cordis.patch.yml 钉死，
  # 独立安装要占自己的全局 id），派生规则会得到 web-ui-dsh-agents；家族行 id 统一用
  # 不带 dsh- 前缀的短名，这里从第一版就锁成 web-ui-agents，省掉日后迁移（与
  # win-bash 同理）。该家族是 #1901 之后新增的行，没有 tombstones 子路径需要跟着它。
  dsh-agents: web-ui-agents
  dsh-win-bash: web-ui-win-bash
  ui-plugin-manager-update-check: web-ui-plugin-manager

# 家族行标题与备注（shellNotes）：官方插件页里每条家族行的标题，以及标题下方那条灰色说明。
# 单行 JSON flow mapping：id 是家族子路径（web-all/<sub> 的 <sub>），嵌套的 title.zh / title.en
# 是该行的行标题（zh 面向中文界面，英文产品名照抄产品名），zh / en / ru 是标题下方的灰色用途说明。
# 生成器把 title 写成 shell-metadata/<sub>/locale/<lang>.json 的 meta.title、把说明写成
# meta.description——同一条官方通道（宿主 readPluginMeta 读 <specifier>/locale/<lang>.json）；
# patch 行不承载任何展示文本，所以不要往 cordis.patch.yml 手写标题或说明。
# 三个语言文件都写：en 用 title.en、zh 用 title.zh，ru 没有单独标题时回落 title.en。
# title.zh 不得与 title.en 相同；缺 title、title 不是对象、zh 或 en 为空、zh 与 en 同串都会让
# 生成器报错（fail closed）——展示位没有兜底文案。
# 说明的 ru 随本聚合挂载的 dsh-i18n 语言包生效：宿主枚举整个 locale 目录，语言文件存在即被读取，
# 无需固定语言集。
# zh 说明每条不超过 20 个汉字：说明行在标题下只占一行，超长会折行；不要复述包名。
# 覆盖全集：本聚合导出的每个家族子路径（含 tombstones 空壳与 retiredPlugins 登记）都必须有一条，
# 缺行、未知 id 或重复 id 都会让生成器报错（fail closed）。已迁出的四个卫星家族沿用各自的产品
# 描述，老 profile 仍会挂载这些空壳行。
# 彻底移除的家族不在本段：它们不保留任何空壳子路径与 shell-metadata 展示资源，老 profile 里
# 残留的 @linxin666/dsh-web-all/<family> 行名会直接 ERR_PACKAGE_PATH_NOT_EXPORTED（硬报错），
# 不再是静默 no-op。
