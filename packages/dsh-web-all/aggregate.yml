# 外部 npm 插件段：alpha 分支（2026-09-17 决策）不内置 dsh-better-sidebar。
# 该插件 0.19.1 的全部 @deepseek-ai/dsh-* peer 声明为 ^0.1.5-rc.1，按 semver
# 不覆盖本分支的 0.2.1-rc.2 cohort（预发布版本只匹配同 [major,minor,patch]
# 元的区间），因此 alpha 实验环境不再挂载这个右侧面板插件：聚合包不依赖它、
# profile 里也不出现它的行。需要右侧面板时按需安装
# （dsh plugin --profile <name> add dsh-better-sidebar@latest）。
# dev 分支保持内置 0.19.1，alpha 每次从 dev rebase 后需重新移除本段。
# 历史沿革（dev 侧仍适用）：2026-08-30 曾因 alpha.2 移除
# `@deepseek-ai/dsh-client-runtime` 面把本行与 dsh-archive-manager 一并排除；
# 2026-08-31 以 0.18.0-alpha.0 回归（inject 改用 dsh-client-modules）；
# 2026-09-04 随 rc.1 cohort 升至 0.18.0 正式版；2026-09-10 升至 0.19.0
# （inject 含 optional 的 dsh-client-ui-sidebar-right 面）；2026-09-11 升至
# 0.19.1。
# @mlgbnb/dsh-archive-manager 仍然排除：其 latest 1.0.7 仍 import 已移除面。
# 出厂默认关闭的可选行（2026-09-09 产品决策）：工具/探索类家族插件对新装用户
# 不加载（设置入口也不出现），在 设置 → 插件 → 插件管理 的聚合子行里逐个开启；
# 开启即写入用户层 disabled:false 覆盖（优先于本默认），停用回写 disabled:true。
# 锁定的核心行（compat/settings/plugin-manager）不可列入本清单。
# liangshen 不列入本清单（2026-10-10 决策）：梁神模式是新会话首页的常驻模式开关，
# 默认启动才让新装用户看到它；理由与取舍见 Agent Note
# .agents/notes/implemented/architecture/2026-10-10-liangshen-row-enabled-by-default.md。
inactive:
  - web-ui-ssh
  - web-ui-skill-explorer
# 归档设置入口（2026-09-15 原生优先决策）：dsh-session-archive 注册官方 section id
# archived-sessions 与 order 25 接管该入口，把「原生恢复列表 + 家族批量归档/删除/
# 自动策略」放在同一页。>=0.2.1-rc.2 的官方 dsh-web-app 不再挂载
# ui-settings-unarchive-sessions 行，所以这里没有 retire 目标：对不存在的行写
# disabled 覆盖只会让 loader 每次启动都报 "patch: entry ... not found"。加回 retire
# 目标前必须先在当前 cohort 上用 dsh --profile <name> --dump-config 确认该外部行存在。
# 兼容退役子插件导出：避免老用户 profile 残留旧条目时 Node.js 抛出 ERR_PACKAGE_PATH_NOT_EXPORTED
# 2026-09-23：describe-image 与 doctor 两个插件自家族移除，同样保留空壳导出。
tombstones:
  - desktop-launcher
  - dsh-perf
  - describe-image
  - doctor
  - model-capabilities
  # 迁出为独立仓库的家族子路径：行已改为 npm 外部行（直挂真实包名），但旧 profile
  # 里记录的行名仍是 @linxin666/dsh-web-all/<family>。保留这些 shell 子路径导出
  # 让那些 profile 仍可 import，不抛 ERR_PACKAGE_PATH_NOT_EXPORTED。
  - pet
  - preset-center
  - skin-center
  - community-plugins
  # issue #1901：仓库内家族行改为直挂真实包名（加载器据此下发各自的浏览器半区，
  # 不再由本包 compat 客户端内联整份副本）。旧 profile 记录的行名仍是这些 shell
  # 子路径，必须继续可解析，否则那条老行会让整组 boot 抛
  # ERR_PACKAGE_PATH_NOT_EXPORTED。tombstones 只保留 shell 导出，不再产出条目。
  - settings
  - plugin-manager
  - market
  - task-board
  - task-board-github
  - git-graph
  - remote-web-ui
  - update
  - ssh
  - liangshen
  - skill-explorer
  - usage
  - session-archive
  - win-bash

# 退役插件登记（retiredPlugins）：每个已退役家族的真实包名，单行 JSON flow mapping（与
# rows: / shellNotes: 同风格）。这是唯一事实源：生成器把它写进
# packages/dsh-web-all/src/retired-plugins.generated.ts（RETIRED_FAMILIES / RETIRED_PLUGINS），
# 壳 src/shell.ts 由生成模块派生，不再手写包名清单。
# 语义：老 profile 里残留的家族行，其 name 仍是子路径 @linxin666/dsh-web-all/<family>（靠
# tombstones 段保证仍可解析），壳从该行的 config.plugin 读到已退役的真实包名后按静默 no-op
# 处理（不 import、不记 degraded），一次正常退役不会在健康面板里变成「插件坏了」。
# 约束（生成器 fail closed）：family 必须已在 tombstones 段里（子路径导出要为老 profile 保留），
# 且不得同时出现在 deps 里（退役插件不能又是本包依赖）。新增退役家族时两段一起改。
retiredPlugins:
  - {"family":"desktop-launcher","plugin":"@linxin666/dsh-desktop-launcher"}
  - {"family":"dsh-perf","plugin":"@linxin666/dsh-perf"}
  - {"family":"describe-image","plugin":"@linxin666/dsh-tool-describe-image"}
  - {"family":"doctor","plugin":"@linxin666/dsh-doctor"}
  - {"family":"model-capabilities","plugin":"@linxin666/dsh-client-ui-model-capabilities"}