# bundle patch for the page-annotate plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/page-annotate`.
- insert:
    - id: page-annotate
      name: '@linxin666/dsh-page-annotate'
