<svg xmlns="http://www.w3.org/2000/svg" width="240" height="44" viewBox="0 0 240 44"
  preserveAspectRatio="none" fill="none">
  <title>Observatory record sleeve — workspace folder (night)</title>

  <!-- 纸身：有体，但不是色块 -->
  <path d="M1.5 1.5 H84 V15 H238.5 V42.5 H1.5 Z" fill="#c2a55a16"/>
  <path d="M1.5 1.5 H84 V15 H238.5 V42.5 H1.5 Z" stroke="#c2a55a80" stroke-width="1" stroke-linejoin="round"/>

  <!-- 标签耳：两行刻线 -->
  <path d="M10 7 H74" stroke="#c2a55a9e" stroke-width="1.3"/>
  <path d="M10 11.6 H54" stroke="#c2a55a57" stroke-width="1"/>
  <!-- 耳与体之间的分界 -->
  <path d="M84 15 V42.5" stroke="#c2a55a38" stroke-width="0.8"/>

  <!-- 翻盖：两条折线交于一点——这是这套镂花的主笔 -->
  <path d="M90 18 L162 29" stroke="#c2a55a57" stroke-width="0.85"/>
  <path d="M238.5 18 L162 29" stroke="#c2a55a57" stroke-width="0.85"/>

  <!-- 火漆：翻盖闭合处 -->
  <circle cx="162" cy="29" r="2.4" fill="undefinedad"/>
  <circle cx="162" cy="29" r="5.2" stroke="#c2a55a80" stroke-width="0.85"/>

  <!-- 底部折痕 -->
  <path d="M6 37 H234" stroke="#c2a55a33" stroke-width="0.8"/>

  <!-- 标签耳左上角的角线 -->
  <path d="M5 13 V5 H15" stroke="#c2a55a80" stroke-width="1.1"/>
</svg>
