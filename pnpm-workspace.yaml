  - '@deepseek-ai/dsh-typert-protocol@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-user-questions@0.1.2-alpha.4'
  # The aggregate bundle pins dsh-better-sidebar at exactly 0.18.0-alpha.0;
  # pnpm 11's minimum-release-age guard must not reject the fresh version.
  # Scoped to that exact version so later upstream publishes get no cooldown bypass.
  - 'dsh-better-sidebar@0.18.0-alpha.0'
  # The aggregate bundle mounts @mlgbnb/dsh-archive-manager at exactly 1.0.7;
  # pnpm 11's minimum-release-age guard must not reject the fresh version.
  # Scoped to that exact version so later upstream publishes get no cooldown bypass.
  - '@mlgbnb/dsh-archive-manager@1.0.7'
  - '@deepseek-ai/dsh-agent-presets@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-api-gateway@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-api-session-controller@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-api-workspace-controller@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-client-store@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-client-ui-renderer@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-client-ui-session@0.1.2-alpha.4'
