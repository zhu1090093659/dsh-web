# bundle patch for the __NAME__ plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/__NAME__`.
- insert:
    - id: ui-__NAME__
      name: '@linxin666/dsh-client-ui-__NAME__'
